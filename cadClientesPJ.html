<script>
    
////////////////////////////////////////////////////////////////
// MÁSCARAS DE INPUT
////////////////////////////////////////////////////////////////

// ── Aplica máscara enquanto o usuário digita ──────────────

function mascararCNPJ(e) {
    // 00.000.000/0000-00
    let v = e.target.value.replace(/\D/g, '').slice(0, 14);
    if (v.length > 12)      v = v.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{1,2})/, '$1.$2.$3/$4-$5');
    else if (v.length > 8)  v = v.replace(/(\d{2})(\d{3})(\d{3})(\d{1,4})/, '$1.$2.$3/$4');
    else if (v.length > 5)  v = v.replace(/(\d{2})(\d{3})(\d{1,3})/, '$1.$2.$3');
    else if (v.length > 2)  v = v.replace(/(\d{2})(\d{1,3})/, '$1.$2');
    e.target.value = v;
}

function mascararIE(e) {
    // Inscrição Estadual RS: 000/0000000 (9 dígitos)
    let v = e.target.value.replace(/\D/g, '').slice(0, 9);
    if (v.length > 3) v = v.replace(/(\d{3})(\d{1,7})/, '$1/$2');
    e.target.value = v;
}

function mascararTelefone(e) {
    // (99) 3333-3333  — 8 dígitos no número
    let v = e.target.value.replace(/\D/g, '').slice(0, 10);
    if (v.length > 6)      v = v.replace(/(\d{2})(\d{4})(\d{1,4})/, '($1) $2-$3');
    else if (v.length > 2) v = v.replace(/(\d{2})(\d{1,4})/, '($1) $2');
    else if (v.length > 0) v = v.replace(/(\d{1,2})/, '($1');
    e.target.value = v;
}

function mascararCelular(e) {
    // (99) 99999-9999 — 9 dígitos no número
    let v = e.target.value.replace(/\D/g, '').slice(0, 11);
    if (v.length > 7)      v = v.replace(/(\d{2})(\d{5})(\d{1,4})/, '($1) $2-$3');
    else if (v.length > 2) v = v.replace(/(\d{2})(\d{1,5})/, '($1) $2');
    else if (v.length > 0) v = v.replace(/(\d{1,2})/, '($1');
    e.target.value = v;
}

function mascararCEP(e) {
    // 00000-000
    let v = e.target.value.replace(/\D/g, '').slice(0, 8);
    if (v.length > 5) v = v.replace(/(\d{5})(\d{1,3})/, '$1-$2');
    e.target.value = v;
}

// ── Validação de CNPJ no blur ─────────────────────────────

document.addEventListener('DOMContentLoaded', () => {

            // =======================================================
            // LÓGICA DO LOGOUT: Captura o clique no botão Sair
            // =======================================================
            const btnSair = document.getElementById('btnSair');
            if (btnSair) {
                btnSair.addEventListener('click', function (event) {
                    event.preventDefault(); // Evita o comportamento do link '#'
                    
                    // Modifica a variável para forçar novo login no sistema
                    localStorage.setItem("PDV_HABILITADO", "0");
                    
                    // Recarrega a página para travar tudo novamente na hora
                    window.location.reload();
                });
            }
            // =======================================================


    // Guarda de Rota — Executado obrigatoriamente no início do DOMContentLoaded
    if (localStorage.getItem("PDV_HABILITADO") !== "1") {
        alert("Acesso negado! Por favor, realize o login.");
        window.location.href = "index.html";
        return;
    }

    const aplicar = (id, fn) => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('input', fn);
    };

    aplicar('cnpj',     mascararCNPJ);
    aplicar('ie',       mascararIE);
    aplicar('telefone', mascararTelefone);
    aplicar('celular',  mascararCelular);
    aplicar('cep',      mascararCEP);

    // Validação CNPJ no blur
    const elCnpj = document.getElementById('cnpj');
    if (elCnpj) {
        elCnpj.addEventListener('blur', function () {
            const valor = this.value.trim();
            if (valor === '') return;
            if (!validarCNPJ(valor)) {
                alert('CNPJ inválido! Por favor, corrija os dados.');
                setTimeout(() => { this.focus(); this.select(); }, 10);
            }
        });
    }
});

<script>

const STORAGE_KEY = 'PDV_CLIENTES_PJ';
const EDIT_KEY    = 'CLIENTE_PJ_EDITAR';

////////////////////////////////////////////////////////////////
// CNPJ VALIDATOR
////////////////////////////////////////////////////////////////
function validarCNPJ(cnpj) {
    const numeros = cnpj.replace(/\D/g, '');

    if (numeros.length !== 14) return false;
    if (/^(\d)\1+$/.test(numeros)) return false;

    const calcDigito = (base, pesos) => {
        let soma = 0;
        for (let i = 0; i < base.length; i++) soma += parseInt(base[i]) * pesos[i];
        const resto = soma % 11;
        return resto < 2 ? 0 : 11 - resto;
    };

    const pesos1 = [5,4,3,2,9,8,7,6,5,4,3,2];
    const pesos2 = [6,5,4,3,2,9,8,7,6,5,4,3,2];

    const d1 = calcDigito(numeros.slice(0, 12), pesos1);
    const d2 = calcDigito(numeros.slice(0, 13), pesos2);

    return d1 === parseInt(numeros[12]) && d2 === parseInt(numeros[13]);
}

////////////////////////////////////////////////////////////////
// STATE
////////////////////////////////////////////////////////////////

let formularioAlterado = false;

////////////////////////////////////////////////////////////////
// INIT EDIT MODE
////////////////////////////////////////////////////////////////

function carregarEdicao() {

    const editData = localStorage.getItem(EDIT_KEY);
    if (!editData) return;

    const cliente = JSON.parse(editData);

    const form = document.getElementById('formClientePJ');
    if (form) form.dataset.editId = cliente.id;

    const set = (id, val) => {
        const el = document.getElementById(id);
        if (el) el.value = val ?? '';
    };

    set('razaoSocial',      cliente.razaoSocial);
    set('cnpj',             cliente.cnpj);
    set('nomeFantasia',     cliente.nomeFantasia);
    set('ie',               cliente.ie);
    set('dataAbertura',     cliente.dataAbertura);
    set('porte',            cliente.porte);
    set('regimeTributario', cliente.regimeTributario);
    set('nomeResponsavel',  cliente.nomeResponsavel);
    set('cargo',            cliente.cargo);
    set('telefone',         cliente.telefone);
    set('celular',          cliente.celular);
    set('email',            cliente.email);
    set('cep',              cliente.cep);
    set('rua',              cliente.rua);
    set('numero',           cliente.numero);
    set('bairro',           cliente.bairro);
    set('cidade',           cliente.cidade);
    set('estado',           cliente.estado);
    set('observacoes',      cliente.observacoes);

    localStorage.removeItem(EDIT_KEY);
}

////////////////////////////////////////////////////////////////
// LIMPAR FORM
////////////////////////////////////////////////////////////////

function limparFormulario() {

    const ids = [
        'razaoSocial','cnpj','nomeFantasia','ie','dataAbertura',
        'porte','regimeTributario','nomeResponsavel','cargo',
        'telefone','celular','email','cep','rua',
        'numero','bairro','cidade','estado','observacoes'
    ];

    ids.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = '';
    });

    const form = document.getElementById('formClientePJ');
    if (form) delete form.dataset.editId;

    const first = document.getElementById('razaoSocial');

    window.scrollTo({
        top: 0,
        behavior: 'smooth'
    });

    setTimeout(() => {
        if (first) first.focus();
    }, 300);
}

////////////////////////////////////////////////////////////////
// VOLTAR À TABELA
////////////////////////////////////////////////////////////////

function voltarTabela() {
    if (formularioAlterado) {
        if (!confirm('Há alterações não salvas. Deseja sair mesmo assim?')) return;
    }
    formularioAlterado = false;
    window.location.href = 'tabClientesPJ.html';
}

////////////////////////////////////////////////////////////////
// NOVO CLIENTE
////////////////////////////////////////////////////////////////

function novoCliente() {
    if (formularioAlterado) {
        if (!confirm('Descartar alterações?')) return;
    }

    localStorage.removeItem(EDIT_KEY);
    formularioAlterado = false;

    limparFormulario();
}

////////////////////////////////////////////////////////////////
// GERAR ID
////////////////////////////////////////////////////////////////

function gerarId() {
    const lista = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    return lista.length ? Math.max(...lista.map(c => Number(c.id)||0)) + 1 : 1;
}

////////////////////////////////////////////////////////////////
// SALVAR
////////////////////////////////////////////////////////////////

function salvarCadastro(e) {
    if (e && typeof e.preventDefault === 'function') {
        e.preventDefault();
    }

    if (!confirm('Deseja salvar este cliente?')) {
        return;
    }

    const cnpj = document.getElementById('cnpj').value.trim();

    if (!cnpj || !validarCNPJ(cnpj)) {
        alert('CNPJ inválido');
        return;
    }

    const form = document.getElementById('formClientePJ');
    const editId = form?.dataset.editId ? Number(form.dataset.editId) : null;

    const lista = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    const agora = new Date().toISOString();

    const cliente = {
        id: editId || gerarId(),
        razaoSocial: document.getElementById('razaoSocial').value,
        cnpj,
        nomeFantasia: document.getElementById('nomeFantasia').value,
        ie: document.getElementById('ie').value,
        dataAbertura: document.getElementById('dataAbertura').value,
        porte: document.getElementById('porte').value,
        regimeTributario: document.getElementById('regimeTributario').value,
        nomeResponsavel: document.getElementById('nomeResponsavel').value,
        cargo: document.getElementById('cargo').value,
        telefone: document.getElementById('telefone').value,
        celular: document.getElementById('celular').value,
        email: document.getElementById('email').value,
        cep: document.getElementById('cep').value,
        rua: document.getElementById('rua').value,
        numero: document.getElementById('numero').value,
        bairro: document.getElementById('bairro').value,
        cidade: document.getElementById('cidade').value,
        estado: document.getElementById('estado').value,
        observacoes: document.getElementById('observacoes').value,
        dataAlteracao: agora
    };

    if (editId) {
        const idx = lista.findIndex(c => c.id === editId);
        if (idx !== -1) {
            cliente.dataCadastro = lista[idx].dataCadastro;
            lista[idx] = cliente;
        }
    } else {
        cliente.dataCadastro = agora;
        lista.push(cliente);
    }

    localStorage.setItem(STORAGE_KEY, JSON.stringify(lista));

    formularioAlterado = false;

    alert(editId ? 'Cliente atualizado com sucesso!' : 'Cliente salvo com sucesso!');

    window.location.href = 'tabClientePJ.html';
}

function baixarJSON() {
    let clientes = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    const json = JSON.stringify(clientes, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'cadclientesPJ.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

document.addEventListener('DOMContentLoaded', () => {
    if (localStorage.getItem("PDV_HABILITADO") !== "1") {
        alert("Acesso negado! Por favor, realize o login.");
        window.location.href = "index.html";
        return;
    }

    carregarEdicao();

    const form = document.getElementById('formClientePJ');
    if (form) form.addEventListener('submit', salvarCadastro);

    const campos = form?.querySelectorAll('input,select,textarea') || [];
    campos.forEach(c => {
        c.addEventListener('input', () => formularioAlterado = true);
        c.addEventListener('change', () => formularioAlterado = true);
    });

    const first = document.getElementById('razaoSocial');
    if (first) first.focus();
});

window.addEventListener('beforeunload', (e) => {
    if (formularioAlterado) {
        e.preventDefault();
        e.returnValue = '';
    }
});

function importarPrimeiroCliente(e) {
    const file = e.target.files;
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function () {
        try {
            let dados = JSON.parse(reader.result);
            if (!Array.isArray(dados)) dados = [dados];
            if (!dados.length) {
                alert('O arquivo JSON está vazio.');
                return;
            }
            if (formularioAlterado && !confirm('Descartar alterações atuais e carregar o JSON?')) return;

            const c = dados;
            const form = document.getElementById('formClientePJ');
            if (form) form.dataset.editId = c.id || '';

            const set = (id, val) => {
                const el = document.getElementById(id);
                if (el) el.value = val ?? '';
            };

            set('razaoSocial',      c.razaoSocial);
            set('cnpj',             c.cnpj);
            set('nomeFantasia',     c.nomeFantasia);
            set('ie',               c.ie);
            set('dataAbertura',     c.dataAbertura);
            set('porte',            c.porte);
            set('regimeTributario', c.regimeTributario);
            set('nomeResponsavel',  c.nomeResponsavel);
            set('cargo',            c.cargo);
            set('telefone',         c.telefone);
            set('celular',          c.celular);
            set('email',            c.email);
            set('cep',              c.cep);
            set('rua',              c.rua);
            set('numero',           c.numero);
            set('bairro',           c.bairro);
            set('cidade',           c.cidade);
            set('estado',           c.estado);
            set('observacoes',      c.observacoes);

            formularioAlterado = false;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            setTimeout(() => document.getElementById('razaoSocial')?.focus(), 300);
            alert(`Cliente "${c.razaoSocial || 'sem nome'}" carregado com sucesso!`);
        } catch (err) {
            alert('Erro ao ler o JSON: ' + err.message);
        }
        e.target.value = '';
    };
    reader.readAsText(file);
}

function carregarClienteNoForm(id) {
  let lista = [];
  try { lista = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { lista = []; }
  const cliente = lista.find(c => Number(c.id) === Number(id));
  if (!cliente) { alert("Cliente não encontrado."); return; }

  const form = document.getElementById("formClientePJ");
  if (form) form.dataset.editId = cliente.id;

  const set = (fieldId, val) => {
    const el = document.getElementById(fieldId);
    if (el) el.value = val ?? "";
  };
  set("razaoSocial",      cliente.razaoSocial);
  set("cnpj",             cliente.cnpj);
  set("nomeFantasia",     cliente.nomeFantasia);
  set("ie",               cliente.ie);
  set("dataAbertura",     cliente.dataAbertura);
  set("porte",            cliente.porte);
  set("regimeTributario", cliente.regimeTributario);
  set("nomeResponsavel",  cliente.nomeResponsavel);
  set("cargo",            cliente.cargo);
  set("telefone",         cliente.telefone);
  set("celular",          cliente.celular);
  set("email",            cliente.email);
  set("cep",              cliente.cep);
  set("rua",              cliente.rua);
  set("numero",           cliente.numero);
  set("bairro",           cliente.bairro);
  set("cidade",           cliente.cidade);
  set("estado",           cliente.estado);
  set("observacoes",      cliente.observacoes);

  window.scrollTo({ top: 0, behavior: "smooth" });
  setTimeout(() => document.getElementById("razaoSocial")?.focus(), 300);
}
