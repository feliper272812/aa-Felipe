    <script>

        const STORAGE_KEY = 'PDV_CLIENTES_PF';
        const EDIT_KEY = 'CLIENTE_PF_EDITAR';
        
        ////////////////////////////////////////////////////////////////
        // MÁSCARAS DE INPUT
        ////////////////////////////////////////////////////////////////
        function mascararCPF(e) {
            let v = e.target.value.replace(/\D/g, '').slice(0, 11);
            if (v.length > 9)      v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, '$1.$2.$3-$4');
            else if (v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{1,3})/, '$1.$2.$3');
            else if (v.length > 3) v = v.replace(/(\d{3})(\d{1,3})/, '$1.$2');
            e.target.value = v;
        }
        
        function mascararRG(e) {
            let v = e.target.value.replace(/\D/g, '').slice(0, 10);
            if (v.length > 8)      v = v.replace(/(\d{2})(\d{3})(\d{3})(\d{1,2})/, '$1.$2.$3-$4');
            else if (v.length > 5) v = v.replace(/(\d{2})(\d{3})(\d{1,3})/, '$1.$2.$3');
            else if (v.length > 2) v = v.replace(/(\d{2})(\d{1,3})/, '$1.$2');
            e.target.value = v;
        }
        
        function mascararTelefone(e) {
            let v = e.target.value.replace(/\D/g, '').slice(0, 10);
            if (v.length > 6)      v = v.replace(/(\d{2})(\d{4})(\d{1,4})/, '($1) $2-$3');
            else if (v.length > 2) v = v.replace(/(\d{2})(\d{1,4})/, '($1) $2');
            else if (v.length > 0) v = v.replace(/(\d{1,2})/, '($1');
            e.target.value = v;
        }
        
        function mascararCelular(e) {
            let v = e.target.value.replace(/\D/g, '').slice(0, 11);
            if (v.length > 7)      v = v.replace(/(\d{2})(\d{5})(\d{1,4})/, '($1) $2-$3');
            else if (v.length > 2) v = v.replace(/(\d{2})(\d{1,5})/, '($1) $2');
            else if (v.length > 0) v = v.replace(/(\d{1,2})/, '($1');
            e.target.value = v;
        }
        
        function mascararCEP(e) {
            let v = e.target.value.replace(/\D/g, '').slice(0, 8);
            if (v.length > 5) v = v.replace(/(\d{5})(\d{1,3})/, '$1-$2');
            e.target.value = v;
        }
        
        ////////////////////////////////////////////////////////////////
        // CPF VALIDATOR
        ////////////////////////////////////////////////////////////////
        function validarCPF(cpf) {
            const numeros = cpf.replace(/\D/g, '');
            if (numeros.length !== 11) return false;
            if (/^(\d)\1+$/.test(numeros)) return false;
            let soma = 0;
            for (let i = 0; i < 9; i++) { soma += parseInt(numeros.charAt(i)) * (10 - i); }
            let resto = soma % 11;
            let d1 = resto < 2 ? 0 : 11 - resto;
            soma = 0;
            for (let i = 0; i < 10; i++) { soma += parseInt(numeros.charAt(i)) * (11 - i); }
            resto = soma % 11;
            let d2 = resto < 2 ? 0 : 11 - resto;
            return d1 === parseInt(numeros[9]) && d2 === parseInt(numeros[10]);
        }
        
        ////////////////////////////////////////////////////////////////
        // STATE & NAV
        ////////////////////////////////////////////////////////////////
        let formularioAlterado = false;
        
        function limparFormulario() {
            const ids = ['nomeCompleto','cpf','dataNascimento','rg','sexo','telefone','celular','email','cep','rua','numero','bairro','cidade','estado','observacoes'];
            ids.forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
            const form = document.getElementById('formClientePF');
            if (form) delete form.dataset.editId;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            setTimeout(() => { const first = document.getElementById('nomeCompleto'); if (first) first.focus(); }, 300);
        }
        
        function voltarTabela() {
            if (formularioAlterado && !confirm('Há alterações não salvas. Deseja sair mesmo assim?')) return;
            formularioAlterado = false;
            window.location.href = 'tabClientesPF.html';
        }
        
        function novoCliente() {
            if (formularioAlterado && !confirm('Descartar alterações?')) return;
            localStorage.removeItem(EDIT_KEY);
            formularioAlterado = false;
            limparFormulario();
        }
        
        function gerarId() {
            const lista = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            return lista.length ? Math.max(...lista.map(c => Number(c.id)||0)) + 1 : 1;
        }
        
        ////////////////////////////////////////////////////////////////
        // CARREGAR EDIÇÃO (Otimização Assíncrona Anti-Travamento)
        ////////////////////////////////////////////////////////////////
        function carregarEdicao() {
            const editData = localStorage.getItem(EDIT_KEY);
            if (!editData) return;
        
            setTimeout(() => {
                try {
                    const cliente = JSON.parse(editData);
                    const form = document.getElementById('formClientePF');
                    if (form) form.dataset.editId = String(cliente.id).trim();
        
                    const set = (id, val) => { const el = document.getElementById(id); if (el) el.value = val ?? ''; };
                    
                    set('nomeCompleto', cliente.nomeCompleto);
                    set('cpf', cliente.cpf);
                    set('dataNascimento', cliente.dataNascimento);
                    set('rg', cliente.rg);
                    set('sexo', cliente.sexo);
                    set('telefone', cliente.telefone);
                    set('celular', cliente.celular);
                    set('email', cliente.email);
                    set('cep', cliente.cep);
                    set('rua', cliente.rua);
                    set('numero', cliente.numero);
                    set('bairro', cliente.bairro);
                    set('cidade', cliente.cidade);
                    set('estado', cliente.estado);
                    set('observacoes', cliente.observacoes);
                    
                    localStorage.removeItem(EDIT_KEY);
                    formularioAlterado = false;
                } catch (err) {
                    console.error("Erro ao processar dados de edição:", err);
                }
            }, 0);
        }
        
        ////////////////////////////////////////////////////////////////
        // SALVAR CADASTRO
        ////////////////////////////////////////////////////////////////
        function salvarCadastro(e) {
            if (e) e.preventDefault();
            if (!confirm('Deseja salvar este cliente?')) return;
            const cpf = document.getElementById('cpf').value.trim();
            if (!cpf || !validarCPF(cpf)) { alert('CPF inválido'); return; }
        
            const form = document.getElementById('formClientePF');
            const editId = form?.dataset.editId ? Number(form.dataset.editId) : null;
            const lista = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            const agora = new Date().toISOString();
        
            const cliente = {
                id: editId || gerarId(),
                nomeCompleto: document.getElementById('nomeCompleto').value.trim(),
                cpf,
                dataNascimento: document.getElementById('dataNascimento').value,
                rg: document.getElementById('rg').value,
                sexo: document.getElementById('sexo').value,
                telefone: document.getElementById('telefone').value,
                celular: document.getElementById('celular').value,
                email: document.getElementById('email').value,
                cep: document.getElementById('cep').value,
                rua: document.getElementById('rua').value,
                numero: document.getElementById('numero').value,
                bairro: document.getElementById('bairro').value,
                cidade: document.getElementById('cidade').value,
                estado: document.getElementById('estado').value,
                observacoes: document.getElementById('observacoes').value,
                dataAlteracao: agora
            };

            if (editId) {
                const idx = lista.findIndex(c => Number(c.id) === editId);
                if (idx !== -1) { 
                    cliente.dataCadastro = lista[idx].dataCadastro; 
                    lista[idx] = cliente; 
                }
            } else {
                cliente.dataCadastro = agora;
                lista.push(cliente);
            }

            localStorage.setItem(STORAGE_KEY, JSON.stringify(lista));
            formularioAlterado = false;
            alert(editId ? 'Cliente updated com sucesso!' : 'Cliente salvo com sucesso!');
            window.location.href = 'tabClientesPF.html';
        }

        ////////////////////////////////////////////////////////////////
        // BAIXAR JSON
        ////////////////////////////////////////////////////////////////
        function baixarJSON() {
            let clientes = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            const json = JSON.stringify(clientes, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'cadclientesPF.json';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        ////////////////////////////////////////////////////////////////
        // IMPORTAR JSON
        ////////////////////////////////////////////////////////////////
        function importarPrimeiroCliente(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function () {
                try {
                    let dados = JSON.parse(reader.result);
                    if (!Array.isArray(dados)) dados = [dados];
                    if (!dados.length) { alert('O arquivo JSON está vazio.'); return; }
                    if (formularioAlterado && !confirm('Descartar alterações atuais e carregar o JSON?')) return;

                    const c = dados[0];
                    const form = document.getElementById('formClientePF');
                    if (form) form.dataset.editId = c.id ? String(c.id).trim() : '';

                    const set = (id, val) => { const el = document.getElementById(id); if (el) el.value = val ?? ''; };
                    set('nomeCompleto',   c.nomeCompleto || c.nome);
                    set('cpf',            c.cpf);
                    set('dataNascimento', c.dataNascimento || c.dataNasc);
                    set('rg',             c.rg);
                    set('sexo',           c.sexo);
                    set('telefone',       c.telefone);
                    set('celular',        c.celular);
                    set('email',          c.email);
                    set('cep',            c.cep);
                    set('rua',            c.rua || c.endereco);
                    set('numero',         c.numero);
                    set('bairro',         c.bairro);
                    set('cidade',         c.cidade);
                    set('estado',         c.estado);
                    set('observacoes',    c.observacoes || c.obs);

                    formularioAlterado = false;
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    setTimeout(() => document.getElementById('nomeCompleto')?.focus(), 300);
                    alert(`Cliente "${c.nomeCompleto || c.nome || 'sem nome'}" carregado com sucesso!`);
                } catch (err) { alert('Erro ao ler o JSON: ' + err.message); }
                e.target.value = '';
            };
            reader.readAsText(file);
        }

        ////////////////////////////////////////////////////////////////
        // PESQUISA MULTICAMPOS (Nome, CPF, Nascimento ou Rua)
        ////////////////////////////////////////////////////////////////
        function pesquisarClienteMultiCampos(event) {
            if (event) event.preventDefault();
            const termo = document.getElementById('inputBuscaNav').value.trim();
            if (!termo) { alert('Digite algo para pesquisar.'); return; }

            const normalizar = (str) => (str ?? '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
            const apenasNumeros = (str) => (str ?? '').toString().replace(/\D/g, '');

            const termoNormalizado = normalizar(termo);
            const termoNumeros = apenasNumeros(termo);
            const lista = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

            const c = lista.find(cl => {
                const nomeCompletoVal = cl.nomeCompleto || cl.nome || "";
                const nomeMatch = normalizar(nomeCompletoVal).includes(termoNormalizado);
                const cpfMatch = termoNumeros && apenasNumeros(cl.cpf).includes(termoNumeros);
                const ruaMatch = normalizar(cl.rua).includes(termoNormalizado);
                const dataOrigem = cl.dataNascimento || '';
                const dataBR = dataOrigem.split('-').reverse().join('');
                const dataMatch = dataOrigem.includes(termo) || apenasNumeros(termo).length >= 4 && (dataOrigem.replace(/\D/g, '').includes(termoNumeros) || dataBR.includes(termoNumeros));

                return nomeMatch || cpfMatch || ruaMatch || dataMatch;
            });

            if (!c) { alert('Nenhum cliente encontrado com os dados informados.'); return; }

            const form = document.getElementById('formClientePF');
            if (form) form.dataset.editId = c.id ? String(c.id).trim() : '';

            const set = (id, val) => { const el = document.getElementById(id); if (el) el.value = val ?? ''; };
            set('nomeCompleto',   c.nomeCompleto || c.nome);
            set('cpf',            c.cpf);
            set('dataNascimento', c.dataNascimento);
            set('rg',             c.rg);
            set('sexo',           c.sexo);
            set('telefone',       c.telefone);
            set('celular',        c.celular);
            set('email',          c.email);
            set('cep',            c.cep);
            set('rua',            c.rua);
            set('numero',         c.numero);
            set('bairro',         c.bairro);
            set('cidade',         c.cidade);
            set('estado',         c.estado);
            set('observacoes',    c.observacoes);

            formularioAlterado = false;
            document.getElementById('inputBuscaNav').value = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            setTimeout(() => document.getElementById('nomeCompleto')?.focus(), 300);
        }

        window.novoCliente = novoCliente;
    </script>

<!-- INITIALIZATION AND LIFE-CYCLE EVENTS (PREVENÇÃO DE LARGURA DE BANDA DO SCRIPT) -->
<script>
document.addEventListener('DOMContentLoaded', () => {
    // 1. Guarda de Rota imediato (Leitura simples do LocalStorage)
    if (localStorage.getItem("PDV_HABILITADO") !== "1") {
        alert("Acesso negado! Por favor, realize o login.");
        window.location.href = "index.html";
        return;
    }

    const inputNome = document.getElementById("nomeCompleto");
    if (inputNome) {
        inputNome.focus();
    }


    // 2. O evento de clique do 'btnSair' foi removido porque agora roda globalmente pelo autenticacao.js

    // 3. Captura delegada única: impede sobrecarga de escutas dinâmicas no formulário
    const form = document.getElementById('formClientePF');
    if (form) {
        form.addEventListener('submit', salvarCadastro);
        form.addEventListener('input', (e) => {
            if (e.target.matches('input, select, textarea')) { formularioAlterado = true; }
        });
        form.addEventListener('change', (e) => {
            if (e.target.matches('input, select, textarea')) { formularioAlterado = true; }
        });
    }

    // 4. Dispara a carga da edição de forma assíncrona isolada
    carregarEdicao();
});


</script>
