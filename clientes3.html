<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabela de Clientes</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f13;
    --surface: #18181f;
    --border: #2a2a38;
    --accent: #e8ff47;
    --accent2: #7b61ff;
    --text: #f0f0f5;
    --muted: #6b6b80;
    --danger: #ff4747;
    --success: #47ffb2;
    --warning: #ffb347;
    --input-bg: #111118;
    --row-hover: rgba(255,255,255,0.03);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    padding: 2rem 1rem;
    background-image: radial-gradient(ellipse at 80% 10%, #1a1a2e 0%, transparent 55%),
                      radial-gradient(ellipse at 10% 90%, #0d0d1a 0%, transparent 55%);
  }

  .container { max-width: 1100px; margin: 0 auto; }

  header {
    margin-bottom: 2rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 1.5rem;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.4rem;
    flex-wrap: wrap;
    gap: 0.75rem;
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: -0.03em;
  }
  h1 span { color: var(--accent); }

  .badge {
    font-size: 0.7rem;
    font-weight: 600;
    background: var(--accent2);
    color: #fff;
    padding: 0.25rem 0.75rem;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .subtitle { font-size: 0.85rem; color: var(--muted); }

  .nav-link {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.8rem;
    color: var(--accent);
    text-decoration: none;
    margin-top: 0.75rem;
    transition: opacity 0.2s;
  }
  .nav-link:hover { opacity: 0.7; }

  /* ── Toolbar ── */
  .toolbar {
    display: flex;
    gap: 0.75rem;
    margin-bottom: 1.25rem;
    flex-wrap: wrap;
    align-items: center;
  }

  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
  }

  .search-icon {
    position: absolute;
    left: 0.8rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 0.9rem;
    pointer-events: none;
  }

  input[type="search"], select.filter {
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    padding: 0.6rem 0.9rem 0.6rem 2.2rem;
    outline: none;
    width: 100%;
    transition: border-color 0.2s;
  }
  select.filter { padding-left: 0.9rem; min-width: 120px; width: auto; flex-shrink: 0; }
  input[type="search"]:focus, select.filter:focus { border-color: var(--accent2); }
  select.filter option { background: var(--surface); }

  button {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.82rem;
    font-weight: 500;
    border: none;
    border-radius: 8px;
    padding: 0.65rem 1.1rem;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    white-space: nowrap;
  }

  .btn-primary { background: var(--accent); color: #000; font-weight: 700; }
  .btn-primary:hover { background: #d4eb00; }

  .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--muted); background: rgba(255,255,255,0.04); }

  .btn-download { background: transparent; color: var(--accent2); border: 1px solid rgba(123,97,255,0.4); }
  .btn-download:hover { background: rgba(123,97,255,0.08); }

  /* ── Stats ── */
  .stats {
    display: flex;
    gap: 1rem;
    margin-bottom: 1.25rem;
    flex-wrap: wrap;
  }

  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.6rem 1rem;
    font-size: 0.78rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .stat strong { color: var(--text); font-size: 1rem; font-family: 'Syne', sans-serif; font-weight: 700; }

  /* ── Table ── */
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
  }

  thead {
    background: rgba(255,255,255,0.03);
    border-bottom: 1px solid var(--border);
  }

  th {
    padding: 0.85rem 1rem;
    text-align: left;
    font-family: 'Syne', sans-serif;
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  th:hover { color: var(--text); }
  th .sort-icon { margin-left: 0.25rem; opacity: 0.4; }
  th.sorted .sort-icon { opacity: 1; color: var(--accent); }

  td {
    padding: 0.8rem 1rem;
    border-bottom: 1px solid rgba(42,42,56,0.5);
    vertical-align: middle;
  }

  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--row-hover); }

  .cod { font-family: 'Syne', sans-serif; font-weight: 700; color: var(--muted); font-size: 0.75rem; }

  .nome-cell { font-weight: 500; max-width: 200px; }
  .nome-small { font-size: 0.72rem; color: var(--muted); margin-top: 0.15rem; }

  .badge-status {
    display: inline-block;
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    font-size: 0.68rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .status-ativo { background: rgba(71,255,178,0.12); color: var(--success); }
  .status-inativo { background: rgba(107,107,128,0.15); color: var(--muted); }
  .status-bloqueado { background: rgba(255,71,71,0.12); color: var(--danger); }

  .badge-cat {
    display: inline-block;
    padding: 0.18rem 0.55rem;
    border-radius: 6px;
    font-size: 0.67rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    background: rgba(123,97,255,0.12);
    color: var(--accent2);
  }

  .actions-cell { display: flex; gap: 0.5rem; }

  .btn-icon {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.35rem 0.6rem;
    font-size: 0.75rem;
    cursor: pointer;
    color: var(--muted);
    transition: all 0.15s;
  }
  .btn-icon:hover { border-color: var(--accent2); color: var(--accent2); background: rgba(123,97,255,0.08); }
  .btn-icon.del:hover { border-color: var(--danger); color: var(--danger); background: rgba(255,71,71,0.08); }

  .empty-state {
    text-align: center;
    padding: 3.5rem 2rem;
    color: var(--muted);
  }
  .empty-state .emoji { font-size: 2.5rem; margin-bottom: 0.75rem; }
  .empty-state p { font-size: 0.9rem; }

  /* ── Modal de confirmação ── */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 500;
  }
  .overlay.show { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 2rem;
    max-width: 380px;
    width: 90%;
    text-align: center;
  }
  .modal h3 { font-family: 'Syne', sans-serif; font-size: 1.1rem; margin-bottom: 0.5rem; }
  .modal p { font-size: 0.85rem; color: var(--muted); margin-bottom: 1.5rem; }
  .modal-actions { display: flex; gap: 0.75rem; justify-content: center; }
  .btn-confirm-del { background: var(--danger); color: #fff; border: none; border-radius: 8px; padding: 0.7rem 1.5rem; font-family: 'DM Sans', sans-serif; font-weight: 600; cursor: pointer; }
  .btn-confirm-del:hover { background: #e03030; }

  .toast {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    padding: 0.85rem 1.25rem;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    transform: translateY(120%);
    opacity: 0;
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 999;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { background: var(--success); color: #000; }
  .toast.error { background: var(--danger); color: #fff; }

  .pagination {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.85rem 1rem;
    border-top: 1px solid var(--border);
    font-size: 0.78rem;
    color: var(--muted);
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  .page-btns { display: flex; gap: 0.4rem; }
  .page-btns button {
    padding: 0.35rem 0.7rem;
    border-radius: 6px;
    font-size: 0.75rem;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .page-btns button.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }
  .page-btns button:hover:not(.active) { border-color: var(--muted); color: var(--text); }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="header-top">
      <h1>Cad.<span>Clientes</span></h1>
      <span class="badge">Tabela</span>
    </div>
    <p class="subtitle">Listagem de todos os clientes cadastrados</p>
    <a href="cadClientes_form.html" class="nav-link">+ Novo cliente</a>
  </header>

  <div class="stats" id="statsBar">
    <div class="stat"><strong id="statTotal">0</strong> Total</div>
    <div class="stat"><strong id="statAtivo">0</strong> Ativos</div>
    <div class="stat"><strong id="statInativo">0</strong> Inativos</div>
    <div class="stat"><strong id="statBloqueado">0</strong> Bloqueados</div>
  </div>

  <div class="toolbar">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="search" id="busca" placeholder="Buscar por nome, e-mail, CPF/CNPJ..." oninput="renderTabela()">
    </div>
    <select class="filter" id="filtroStatus" onchange="renderTabela()">
      <option value="">Todos status</option>
      <option value="Ativo">Ativo</option>
      <option value="Inativo">Inativo</option>
      <option value="Bloqueado">Bloqueado</option>
    </select>
    <select class="filter" id="filtroTipo" onchange="renderTabela()">
      <option value="">Todos tipos</option>
      <option value="F">Física</option>
      <option value="J">Jurídica</option>
    </select>
    <button class="btn-ghost" onclick="limparFiltros()">✕ Limpar</button>
    <button class="btn-download" onclick="baixarJSON()">⬇ JSON</button>
    <a href="cadClientes_form.html" style="text-decoration:none;"><button class="btn-primary">+ Novo</button></a>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th onclick="sortBy('codigo')">Cód <span class="sort-icon" id="si-codigo">↕</span></th>
          <th onclick="sortBy('nome')">Nome / Razão <span class="sort-icon" id="si-nome">↕</span></th>
          <th onclick="sortBy('tipoPessoa')">Tipo <span class="sort-icon" id="si-tipoPessoa">↕</span></th>
          <th>CPF / CNPJ</th>
          <th>Telefone</th>
          <th>Cidade / UF</th>
          <th onclick="sortBy('status')">Status <span class="sort-icon" id="si-status">↕</span></th>
          <th>Categoria</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div id="emptyState" class="empty-state" style="display:none">
      <div class="emoji">📋</div>
      <p>Nenhum cliente encontrado.</p>
    </div>
    <div class="pagination" id="pagination"></div>
  </div>

</div>

<!-- Modal exclusão -->
<div class="overlay" id="modalOverlay">
  <div class="modal">
    <h3>Excluir cliente?</h3>
    <p id="modalDesc">Esta ação não pode ser desfeita.</p>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="fecharModal()">Cancelar</button>
      <button class="btn-confirm-del" onclick="confirmarExclusao()">Excluir</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const STORAGE_KEY = 'cadClientes';

  let sortCol = 'codigo';
  let sortAsc = true;
  let pageAtual = 1;
  const POR_PAGINA = 15;
  let deletingCodigo = null;

  function getClientes() {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  }

  function saveClientes(arr) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
  }

  function nomeExibicao(c) {
    return c.tipoPessoa === 'J' ? (c.razaoSocial || c.nomeFantasia || '') : (c.nome || '');
  }

  function filtrarClientes() {
    const q = document.getElementById('busca').value.toLowerCase();
    const fStatus = document.getElementById('filtroStatus').value;
    const fTipo = document.getElementById('filtroTipo').value;
    let list = getClientes();

    if (q) list = list.filter(c => {
      const nome = nomeExibicao(c).toLowerCase();
      return nome.includes(q) || (c.email||'').toLowerCase().includes(q)
          || (c.cpf||'').includes(q) || (c.cnpj||'').includes(q)
          || (c.codigo||'').includes(q) || (c.telefone||'').includes(q);
    });
    if (fStatus) list = list.filter(c => c.status === fStatus);
    if (fTipo) list = list.filter(c => c.tipoPessoa === fTipo);

    list.sort((a,b) => {
      let va = String(a[sortCol]||'').toLowerCase();
      let vb = String(b[sortCol]||'').toLowerCase();
      if (sortCol === 'codigo') { va = va.padStart(6,'0'); vb = vb.padStart(6,'0'); }
      if (va < vb) return sortAsc ? -1 : 1;
      if (va > vb) return sortAsc ? 1 : -1;
      return 0;
    });
    return list;
  }

  function renderTabela() {
    const list = filtrarClientes();
    const todos = getClientes();

    // stats
    document.getElementById('statTotal').textContent = todos.length;
    document.getElementById('statAtivo').textContent = todos.filter(c=>c.status==='Ativo').length;
    document.getElementById('statInativo').textContent = todos.filter(c=>c.status==='Inativo').length;
    document.getElementById('statBloqueado').textContent = todos.filter(c=>c.status==='Bloqueado').length;

    // paginação
    const totalPags = Math.max(1, Math.ceil(list.length / POR_PAGINA));
    if (pageAtual > totalPags) pageAtual = totalPags;
    const inicio = (pageAtual - 1) * POR_PAGINA;
    const pagina = list.slice(inicio, inicio + POR_PAGINA);

    const tbody = document.getElementById('tbody');
    tbody.innerHTML = '';

    if (!list.length) {
      document.getElementById('emptyState').style.display = 'block';
      document.getElementById('pagination').innerHTML = '';
      return;
    }
    document.getElementById('emptyState').style.display = 'none';

    pagina.forEach(c => {
      const nome = nomeExibicao(c);
      const sub = c.tipoPessoa === 'J' && c.nomeFantasia ? c.nomeFantasia : (c.email || '');
      const doc = c.tipoPessoa === 'F' ? (c.cpf||'—') : (c.cnpj||'—');
      const loc = [c.cidade, c.uf].filter(Boolean).join(' / ') || '—';
      const statusClass = {Ativo:'status-ativo',Inativo:'status-inativo',Bloqueado:'status-bloqueado'}[c.status] || '';

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><span class="cod">${c.codigo}</span></td>
        <td class="nome-cell">
          ${escHtml(nome)}
          ${sub ? `<div class="nome-small">${escHtml(sub)}</div>` : ''}
        </td>
        <td>${c.tipoPessoa === 'J' ? 'Jurídica' : 'Física'}</td>
        <td>${escHtml(doc)}</td>
        <td>${escHtml(c.telefone||'—')}</td>
        <td>${escHtml(loc)}</td>
        <td><span class="badge-status ${statusClass}">${c.status||'—'}</span></td>
        <td>${c.categoria ? `<span class="badge-cat">${escHtml(c.categoria)}</span>` : '—'}</td>
        <td>
          <div class="actions-cell">
            <a href="cadClientes_form.html?editar=${c.codigo}" style="text-decoration:none">
              <button class="btn-icon" title="Editar">✏️</button>
            </a>
            <button class="btn-icon del" title="Excluir" onclick="abrirModal('${c.codigo}','${escHtml(nome)}')">🗑</button>
          </div>
        </td>
      `;
      tbody.appendChild(tr);
    });

    // paginação
    const pag = document.getElementById('pagination');
    if (totalPags <= 1) { pag.innerHTML = `<span>${list.length} registro${list.length!==1?'s':''}</span>`; return; }

    let html = `<span>${inicio+1}–${Math.min(inicio+POR_PAGINA,list.length)} de ${list.length}</span><div class="page-btns">`;
    html += `<button onclick="goPage(${pageAtual-1})" ${pageAtual===1?'disabled':''}>‹</button>`;
    for (let i=1;i<=totalPags;i++) {
      if (totalPags <= 7 || Math.abs(i-pageAtual)<=2 || i===1 || i===totalPags) {
        html += `<button class="${i===pageAtual?'active':''}" onclick="goPage(${i})">${i}</button>`;
      } else if (Math.abs(i-pageAtual)===3) html += `<button disabled>…</button>`;
    }
    html += `<button onclick="goPage(${pageAtual+1})" ${pageAtual===totalPags?'disabled':''}>›</button></div>`;
    pag.innerHTML = html;
  }

  function goPage(p) {
    const list = filtrarClientes();
    const max = Math.ceil(list.length / POR_PAGINA);
    if (p < 1 || p > max) return;
    pageAtual = p;
    renderTabela();
  }

  function sortBy(col) {
    if (sortCol === col) sortAsc = !sortAsc;
    else { sortCol = col; sortAsc = true; }
    document.querySelectorAll('.sort-icon').forEach(el => el.textContent = '↕');
    const si = document.getElementById('si-'+col);
    if (si) { si.textContent = sortAsc ? '↑' : '↓'; si.closest('th').classList.add('sorted'); }
    pageAtual = 1;
    renderTabela();
  }

  function limparFiltros() {
    document.getElementById('busca').value = '';
    document.getElementById('filtroStatus').value = '';
    document.getElementById('filtroTipo').value = '';
    pageAtual = 1;
    renderTabela();
  }

  function abrirModal(codigo, nome) {
    deletingCodigo = codigo;
    document.getElementById('modalDesc').textContent = `Excluir "${nome}" (#${codigo})? Esta ação não pode ser desfeita.`;
    document.getElementById('modalOverlay').classList.add('show');
  }

  function fecharModal() {
    deletingCodigo = null;
    document.getElementById('modalOverlay').classList.remove('show');
  }

  function confirmarExclusao() {
    if (!deletingCodigo) return;
    const clientes = getClientes().filter(c => c.codigo !== deletingCodigo);
    saveClientes(clientes);
    fecharModal();
    renderTabela();
    showToast('🗑 Cliente excluído.', 'success');
  }

  function baixarJSON() {
    const clientes = getClientes();
    const blob = new Blob([JSON.stringify(clientes, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'cadClientes.json';
    a.click();
    URL.revokeObjectURL(a.href);
    showToast('⬇ Download iniciado', 'success');
  }

  let toastTimer;
  function showToast(msg, type='success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast ${type} show`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // fechar modal clicando fora
  document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target === e.currentTarget) fecharModal();
  });

  renderTabela();
</script>

    <script src="../assets/js/bootstrap.bundle.min.js"></script>

</body>
</html>
