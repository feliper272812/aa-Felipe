    <!-- Controle de tema nativo imediato para evitar flash visual -->
    <!-- ///////////////////////////////////////////////////////// -->

    <script>
        (() => {
            const getStoredTheme = () => localStorage.getItem('theme');
            const getSystemTheme = () => window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            const resolveTheme = (tema) => tema === 'auto' ? getSystemTheme() : tema;
            document.documentElement.setAttribute('data-bs-theme', resolveTheme(getStoredTheme() || 'auto'));
        })();
    </script>

    <!-- BOOTSTRAP 5.3.3 CSS LOCAL -->
    <link id="bootstrap-css-local" href="./css/bootstrap.min.css" rel="stylesheet">

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            let cssCarregado = false;
            for (let i = 0; i < document.styleSheets.length; i++) {
                try {
                    let sheet = document.styleSheets[i];
                    if (sheet.href && sheet.href.indexOf("bootstrap.min.css") !== -1) {
                        if (sheet.cssRules && sheet.cssRules.length > 0) {
                            cssCarregado = true;
                            break;
                        }
                    }
                } catch (e) {
                    // Captura restrições de segurança de CORS se houverem
                }
            }

            if (!cssCarregado) {
                alert('bootstrap.min.css local não carregou. Usando CDN como reserva.');
                console.warn('bootstrap.min.css local não carregou. Usando CDN como reserva.');
                
                let cdn = document.createElement("link");
                cdn.rel = "stylesheet";
                cdn.href = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css";
                cdn.integrity = "sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH";
                cdn.crossOrigin = "anonymous";
                document.head.appendChild(cdn);
            }
        });
    </script>

    <!-- Script exclusivo da Index para Autenticação por JSON e Gerenciamento do Modal -->
    <script>
        // Função global para carregar o arquivo cadusuarios.json externo para dentro do LocalStorage
        function carregarBaseUsuarios(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    let dados = JSON.parse(e.target.result);
                    
                    if (!Array.isArray(dados)) {
                        dados = [dados];
                    }

                    if (!dados.length) {
                        alert("O arquivo JSON de usuários está vazio.");
                        return;
                    }

                    localStorage.setItem("PDV_USUARIOS", JSON.stringify(dados));
                    verificarStatusBase();
                    alert("Base de dados de usuários carregada e integrada com sucesso!");
                } catch (err) {
                    alert("Erro crítico ao processar o JSON: " + err.message);
                }
                event.target.value = ""; 
            };
            reader.readAsText(file, "UTF-8");
        }

        // Atualiza dinamicamente o badge visual indicando o estado atual da base de usuários
        function verificarStatusBase() {
            const badge = document.getElementById("dbStatusBadge");
            const usuarios = localStorage.getItem("PDV_USUARIOS");
            
            if (usuarios && JSON.parse(usuarios).length > 0) {
                badge.textContent = "Base de Usuários Ativa e Conectada";
                badge.className = "badge bg-success p-2 w-100";
            } else {
                badge.textContent = "Base de Usuários Desconectada (Importe o JSON)";
                badge.className = "badge bg-danger p-2 w-100";
            }
        }

        document.addEventListener("DOMContentLoaded", function () {
            const loginModalEl = document.getElementById('loginModal');
            const loginModal = new bootstrap.Modal(loginModalEl);
            const loginForm = document.getElementById('loginForm');

            // Executa checagem inicial da base de dados local
            verificarStatusBase();

            const pdvHabilitado = localStorage.getItem("PDV_HABILITADO");

            // Valida o estado de autenticação prévia do navegador
            if (pdvHabilitado === "1") {
                document.body.classList.remove('autenticacao-pendente');
            } else {
                document.body.classList.add('autenticacao-pendente');
                loginModal.show();
            }

            // =======================================================
            // LÓGICA DO LOGOUT: Captura o clique no botão Sair
            // =======================================================
            const btnSair = document.getElementById('btnSair');
            if (btnSair) {
                btnSair.addEventListener('click', function (event) {
                    event.preventDefault(); // Evita o comportamento do link '#'
                    
                    // Modifica a variável para forçar novo login no sistema
                    localStorage.setItem("PDV_HABILITADO", "0");
                    
                    // Recarrega a página para travar tudo novamente na hora
                    window.location.reload();
                });
            }

            // ==========================================================================
            // Regra de processamento e validação real do login por Banco de Dados JSON
            // ==========================================================================

            loginForm.addEventListener('submit', function (event) {
                event.preventDefault();

                const userDigitado = document.getElementById("username").value.trim();
                const senhaDigitada = document.getElementById("password").value.trim();

                const baseBruta = localStorage.getItem("PDV_USUARIOS");
                if (!baseBruta) {
                    alert("Acesso negado! Nenhuma base de usuários ativa encontrada no sistema. Por favor, importe o arquivo cadusuarios.json.");
                    return;
                }

                const listaUsuarios = JSON.parse(baseBruta);

                const usuarioValido = listaUsuarios.find(u => 
                    u.usuario && u.usuario.trim() === userDigitado && 
                    u.senha && u.senha.toString().trim() === senhaDigitada
                );

                if (!usuarioValido) {
                    alert("Falha na autenticação! Usuário ou senha incorretos.");
                    localStorage.setItem("PDV_HABILITADO", "0");
                    return;
                }

                localStorage.setItem("PDV_HABILITADO", "1");
                document.body.classList.remove('autenticacao-pendente');
                loginModal.hide();
                alert(`Bem-vindo, ${usuarioValido.usuario}! Sistema liberado.`);
            });
        });
    </script>
