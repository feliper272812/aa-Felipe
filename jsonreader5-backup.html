    <!-- =====================================================
         BOOTSTRAP COLOR MODES
    ====================================================== -->

    <script>

        (() => {

            const getPreferredTheme = () => {

                const storedTheme =
                    localStorage.getItem('theme');

                if(storedTheme){
                    return storedTheme;
                }

                return window.matchMedia(
                    '(prefers-color-scheme: dark)'
                ).matches
                    ? 'dark'
                    : 'light';
            };

            const setTheme = theme => {

                if(
                    theme === 'auto'
                ){

                    document.documentElement.setAttribute(
                        'data-bs-theme',
                        window.matchMedia(
                            '(prefers-color-scheme: dark)'
                        ).matches
                            ? 'dark'
                            : 'light'
                    );

                }else{

                    document.documentElement.setAttribute(
                        'data-bs-theme',
                        theme
                    );
                }
            };

            setTheme(getPreferredTheme());

        })();

    </script>

    <!-- BOOTSTRAP 5.3.3 CSS LOCAL -->

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            let cssCarregado = false;
            for (let i = 0; i < document.styleSheets.length; i++) {
                try {
                    let sheet = document.styleSheets[i];
                    if (sheet.href && sheet.href.indexOf("bootstrap.min.css") !== -1) {
                        if (sheet.cssRules && sheet.cssRules.length > 0) {
                            cssCarregado = true;
                            break;
                        }
                    }
                } catch (e) {
                    // Captura restrições de segurança de CORS se houverem
                }
            }

            if (!cssCarregado) {
                alert('bootstrap.min.css local não carregou. Usando CDN como reserva.');
                console.warn('bootstrap.min.css local não carregou. Usando CDN como reserva.');
                
                let cdn = document.createElement("link");
                cdn.rel = "stylesheet";
                cdn.href = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css";
                cdn.integrity = "sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH";
                cdn.crossOrigin = "anonymous";
                document.head.appendChild(cdn);
            }
        });
    </script>

     BOOTSTRAP JS
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>

    // =====================================================
    // THEME CONTROL
    // =====================================================

    const themeButtons =
        document.querySelectorAll(
            '[data-theme]'
        );

    themeButtons.forEach(button => {

        button.addEventListener('click', () => {

            const theme =
                button.getAttribute(
                    'data-theme'
                );

            localStorage.setItem(
                'theme',
                theme
            );

            if(theme === 'auto'){

                document.documentElement
                    .setAttribute(
                        'data-bs-theme',
                        window.matchMedia(
                            '(prefers-color-scheme: dark)'
                        ).matches
                            ? 'dark'
                            : 'light'
                    );

            }else{

                document.documentElement
                    .setAttribute(
                        'data-bs-theme',
                        theme
                    );
            }

        });

    });

    // =====================================================
    // STATE
    // =====================================================

    let jsonData = {};

    const editor =
        document.getElementById("editor");

    const preview =
        document.getElementById("preview");

    // =====================================================
    // RENDER
    // =====================================================

    function renderEditor(){

        editor.innerHTML = "";

        renderObject(
            jsonData,
            editor,
            0
        );

        updatePreview();
    }

    // =====================================================
    // RENDER OBJECT
    // =====================================================

    function renderObject(
        obj,
        parent,
        level
    ){

        Object.keys(obj).forEach(key => {

            const value = obj[key];

            const node =
                document.createElement("div");

            node.className =
                "json-node";

            // HEADER

            const header =
                document.createElement("div");

            header.className =
                "node-header";

            // TITLE

            const title =
                document.createElement("div");

            title.className =
                "node-title";

            title.innerHTML = `
                Hierarquia:
                <span class="badge bg-secondary badge-level">
                    Nível ${level}
                </span>
            `;

            // ROW

            const row =
                document.createElement("div");

            row.className =
                "row g-3 align-items-end";

            // CAMPO

            const colCampo =
                document.createElement("div");

            colCampo.className =
                "col-md-3";

            colCampo.innerHTML = `
                <label class="form-label">
                    Campo
                </label>
            `;

            const campoInput =
                document.createElement("input");

            campoInput.type = "text";

            campoInput.className =
                "form-control";

            campoInput.value = key;

            colCampo.appendChild(
                campoInput
            );

            // TIPO

            const colTipo =
                document.createElement("div");

            colTipo.className =
                "col-md-2";

            colTipo.innerHTML = `
                <label class="form-label">
                    Tipo
                </label>
            `;

            const tipoSelect =
                document.createElement("select");

            tipoSelect.className =
                "form-select";

            [
                "string",
                "number",
                "boolean",
                "object",
                "array"
            ].forEach(type => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value = type;

                option.textContent =
                    type;

                if(
                    getType(value)
                    === type
                ){

                    option.selected = true;
                }

                tipoSelect.appendChild(
                    option
                );

            });

            colTipo.appendChild(
                tipoSelect
            );

            // VALOR

            const colValor =
                document.createElement("div");

            colValor.className =
                "col-md-4";

            colValor.innerHTML = `
                <label class="form-label">
                    Valor
                </label>
            `;

            const valorInput =
                document.createElement("input");

            valorInput.type = "text";

            valorInput.className =
                "form-control";

            if(
                typeof value !== "object"
                || value === null
            ){

                valorInput.value = value;

            }else{

                valorInput.value =
                    JSON.stringify(value);

                valorInput.disabled = true;
            }

            colValor.appendChild(
                valorInput
            );

            // ACTIONS

            const colAcoes =
                document.createElement("div");

            colAcoes.className =
                "col-md-3";

            const actions =
                document.createElement("div");

            actions.className =
                "d-flex gap-2";

            const btnAdd =
                document.createElement("button");

            btnAdd.className =
                "btn btn-success w-100";

            btnAdd.innerHTML =
                "+ Filho";

            const btnDelete =
                document.createElement("button");

            btnDelete.className =
                "btn btn-danger w-100";

            btnDelete.innerHTML =
                "Excluir";

            actions.appendChild(
                btnAdd
            );

            actions.appendChild(
                btnDelete
            );

            colAcoes.appendChild(
                actions
            );

            // BUILD

            row.appendChild(
                colCampo
            );

            row.appendChild(
                colTipo
            );

            row.appendChild(
                colValor
            );

            row.appendChild(
                colAcoes
            );

            header.appendChild(
                title
            );

            header.appendChild(
                row
            );

            node.appendChild(
                header
            );

            // EVENTS

            campoInput.addEventListener(
                "change",
                () => {

                    if(
                        campoInput.value
                        === key
                    ){
                        return;
                    }

                    obj[
                        campoInput.value
                    ] = obj[key];

                    delete obj[key];

                    renderEditor();

                }
            );

            tipoSelect.addEventListener(
                "change",
                () => {

                    switch(
                        tipoSelect.value
                    ){

                        case "string":
                            obj[key] = "";
                            break;

                        case "number":
                            obj[key] = 0;
                            break;

                        case "boolean":
                            obj[key] = true;
                            break;

                        case "object":
                            obj[key] = {};
                            break;

                        case "array":
                            obj[key] = [];
                            break;
                    }

                    renderEditor();

                }
            );

            valorInput.addEventListener(
                "input",
                () => {

                    switch(
                        tipoSelect.value
                    ){

                        case "string":

                            obj[key] =
                                valorInput.value;

                            break;

                        case "number":

                            obj[key] =
                                Number(
                                    valorInput.value
                                );

                            break;

                        case "boolean":

                            obj[key] =
                                valorInput.value
                                === "true";

                            break;
                    }

                    updatePreview();

                }
            );

            btnAdd.addEventListener(
                "click",
                () => {

                    if(
                        typeof obj[key]
                        !== "object"
                        || obj[key] === null
                    ){

                        alert(
                            "Somente objetos e arrays podem receber filhos."
                        );

                        return;
                    }

                    if(
                        Array.isArray(
                            obj[key]
                        )
                    ){

                        obj[key].push({
                            novoCampo:""
                        });

                    }else{

                        obj[key][
                            "novoCampo"
                        ] = "";
                    }

                    renderEditor();

                }
            );

            btnDelete.addEventListener(
                "click",
                () => {

                    delete obj[key];

                    renderEditor();

                }
            );

            // CHILDREN

            if(
                typeof value === "object"
                && value !== null
            ){

                const children =
                    document.createElement(
                        "div"
                    );

                children.className =
                    "children";

                if(
                    Array.isArray(value)
                ){

                    value.forEach(
                        (
                            item,
                            index
                        ) => {

                            const arr =
                                document.createElement(
                                    "div"
                                );

                            arr.className =
                                "json-node";

                            arr.innerHTML = `
                                <div class="alert alert-info py-2">
                                    Array índice:
                                    <strong>${index}</strong>
                                </div>
                            `;

                            if(
                                typeof item
                                === "object"
                            ){

                                renderObject(
                                    item,
                                    arr,
                                    level + 1
                                );
                            }

                            children.appendChild(
                                arr
                            );

                        }
                    );

                }else{

                    renderObject(
                        value,
                        children,
                        level + 1
                    );
                }

                node.appendChild(
                    children
                );
            }

            parent.appendChild(
                node
            );

        });
    }

    // =====================================================
    // TYPE
    // =====================================================

    function getType(value){

        if(
            Array.isArray(value)
        ){
            return "array";
        }

        return typeof value;
    }

    // =====================================================
    // PREVIEW
    // =====================================================

    function updatePreview(){

        preview.value =
            JSON.stringify(
                jsonData,
                null,
                4
            );
    }

    // =====================================================
    // NEW JSON
    // =====================================================

    document
        .getElementById(
            "btnNovo"
        )
        .addEventListener(
            "click",
            () => {

                jsonData = {};

                renderEditor();

            }
        );

    // =====================================================
    // ADD ROOT
    // =====================================================

    document
        .getElementById(
            "btnAdicionarRaiz"
        )
        .addEventListener(
            "click",
            () => {

                jsonData[
                    "novoCampo"
                ] = "";

                renderEditor();

            }
        );

    // =====================================================
    // IMPORT JSON
    // =====================================================

    document
        .getElementById(
            "fileInput"
        )
        .addEventListener(
            "change",
            e => {

                const file =
                    e.target.files[0];

                if(!file){
                    return;
                }

                const reader =
                    new FileReader();

                reader.onload =
                    function(event){

                    try{

                        jsonData =
                            JSON.parse(
                                event.target.result
                            );

                        renderEditor();

                    }catch(error){

                        alert(
                            "JSON inválido."
                        );

                        console.error(
                            error
                        );
                    }
                };

                reader.readAsText(
                    file
                );

            }
        );

    // =====================================================
    // EXPORT JSON
    // =====================================================

    document
        .getElementById(
            "btnExportar"
        )
        .addEventListener(
            "click",
            () => {

                const blob =
                    new Blob(
                        [
                            JSON.stringify(
                                jsonData,
                                null,
                                4
                            )
                        ],
                        {
                            type:
                                "application/json"
                        }
                    );

                const url =
                    URL.createObjectURL(
                        blob
                    );

                const a =
                    document.createElement(
                        "a"
                    );

                a.href = url;

                a.download =
                    "dados.json";

                a.click();

                URL.revokeObjectURL(
                    url
                );

            }
        );

    // =====================================================
    // INIT
    // =====================================================

    renderEditor();

</script>

</body>
