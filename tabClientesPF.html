<html lang="pt-br" data-bs-theme="auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clientes PF</title>

  <script src="./js/color-modes.js"></script>

    <!-- BOOTSTRAP 5.3.3 CSS (CDN oficial) -->

          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous"> -->

    <!-- BOOTSTRAP 5.3.3 CSS LOCAL -->
    <link id="bootstrap-css-local" href="./css/bootstrap.min.css" rel="stylesheet">

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            let cssCarregado = false;
            for (let i = 0; i < document.styleSheets.length; i++) {
                try {
                    let sheet = document.styleSheets[i];
                    if (sheet.href && sheet.href.indexOf("bootstrap.min.css") !== -1) {
                        if (sheet.cssRules && sheet.cssRules.length > 0) {
                            cssCarregado = true;
                            break;
                        }
                    }
                } catch (e) {
                    // Captura restrições de segurança de CORS se houverem
                }
            }

            if (!cssCarregado) {
                alert('bootstrap.min.css local não carregou. Usando CDN como reserva.');
                console.warn('bootstrap.min.css local não carregou. Usando CDN como reserva.');
                
                let cdn = document.createElement("link");
                cdn.rel = "stylesheet";
                cdn.href = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css";
                cdn.integrity = "sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH";
                cdn.crossOrigin = "anonymous";
                document.head.appendChild(cdn);
            }
        });
    </script>

<body class="d-flex flex-column h-100">

  <header>
    <!-- BARRA DE NAVEGAÇÃO FIXA (NAVBAR) -->
    <div id="nav-placeholder"></div>
  </header>

  <!-- Área Principal - Colada na Navbar -->
  <main class="container-fluid px-2">
    <div class="table-container w-100">
      <div id="barraTituloPF">
        <h3 class="bg-success text-white p-2 text-center" style="border-radius: 8px 8px 0 0;">Tabela de Clientes Pessoa Física</h3>
      </div>
      <!-- Barra de Controle e Ações Superior Completa -->
      <div class="sticky-top bg-body pt-2 pb-2 mb-3 border-bottom">
        <div class="d-flex flex-wrap align-items-center gap-1">
          &nbsp;&nbsp;
          <button class="btn btn-sm btn-primary" onclick="novoClientePF()">🆕 Novo</button>
          <button class="btn btn-sm btn-secondary" onclick="carregarDadosPF()">↺ Atualizar</button>
          <button class="btn btn-sm btn-warning" onclick="baixarJSONPF()">⬇ JSON</button>
          <label for="importJsonFile" class="btn btn-sm btn-info mb-0 text-dark" style="cursor:pointer;">📂 Importar</label>
          <input id="importJsonFile" type="file" accept=".json" class="d-none" onchange="importarJSONPF(event)">
          <button class="btn btn-sm btn-success" onclick="exportarCSVPF()">📊 CSV</button>
          <a href="cadclientesPF.html" class="btn btn-sm btn-outline-success">📝 Cadastro</a>
          <span class="badge text-bg-secondary">Total: <strong id="totalRegistros">0</strong></span>
          <div class="vr mx-2"></div>
          <form class="input-group input-group-sm ms-auto" style="max-width:380px" onsubmit="pesquisarClientes(event)">
            <input id="inputCPF" type="search" class="form-control" placeholder="Nome, CPF, Nasc. ou Rua" aria-label="Pesquisar">
            <button class="btn btn-outline-success" type="submit">🔍</button>
            &nbsp;&nbsp;
          </form>
        </div>
      </div>

      <!-- Estrutura Exata da Tabela de Dados -->
      <div class="table-container shadow rounded border bg-body">
        <div class="tabela-scroll">
          <table class="table table-striped table-hover table-sm mb-0">
            <thead class="table-dark">
              <tr>
                <th>ID</th><th>Ações</th><th>Nome</th><th>CPF</th><th>Data Nasc.</th><th>RG</th><th>Sexo</th>
                <th>Telefone</th><th>Celular</th><th>Email</th><th>CEP</th><th>Rua</th><th>Número</th>
                <th>Bairro</th><th>Cidade</th><th>Estado</th><th>Observações</th><th>Cadastro</th><th>Alteração</th>
              </tr>
            </thead>
            <tbody id="tbodyClientes"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script>
    const STORAGE_KEY = "PDV_CLIENTES_PF";
    const EDIT_KEY = "CLIENTE_PF_EDITAR";

    function getClientes() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; }
    }

    function saveClientes(lista) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(lista));
    }
    function formatarData(iso) {
      if (!iso) return "—";
      const d = new Date(iso.includes("T") ? iso : iso + "T00:00:00");
      if (isNaN(d)) return iso;
      return d.toLocaleDateString("pt-BR");
    }

    function escaparHTML(str) {
      if (str == null) return "";
      return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    ////////////////////////////////////////////////////////////////
    // RENDERIZAÇÃO OTIMIZADA (Evita travamentos de interface)
    ////////////////////////////////////////////////////////////////
    function renderizarTabela(lista) {
      const tbody = document.getElementById("tbodyClientes");
      document.getElementById("totalRegistros").textContent = lista.length;
      
      if (lista.length === 0) {
        tbody.innerHTML = `<tr><td colspan="19" class="text-center text-muted py-4">Nenhum cliente cadastrado. <a href="cadclientesPF.html" class="ms-2">Cadastrar agora →</a></td></tr>`;
        return;
      }
      
      const htmlGerado = lista.map((c) => `
        <tr>
          <td>${escaparHTML(c.id)}</td>
          <td class="text-nowrap">
            <button class="btn btn-sm btn-success py-0 px-1" onclick="editarCliente(${Number(c.id)})">✏️ Editar</button>
            <button class="btn btn-sm btn-danger py-0 px-1" onclick="excluirCliente(${Number(c.id)})">🗑️ Deletar</button>
          </td>
          <td style="min-width:250px">${escaparHTML(c.nomeCompleto || c.nome)}</td>
          <td style="min-width:130px">${escaparHTML(c.cpf)}</td>
          <td>${formatarData(c.dataNascimento)}</td>
          <td style="min-width:110px">${escaparHTML(c.rg)}</td>
          <td>${escaparHTML(c.sexo)}</td>
          <td style="min-width:120px">${escaparHTML(c.telefone)}</td>
          <td style="min-width:140px">${escaparHTML(c.celular)}</td>
          <td>${escaparHTML(c.email)}</td>
          <td style="min-width:110px">${escaparHTML(c.cep)}</td>
          <td style="min-width:200px">${escaparHTML(c.rua)}</td>
          <td>${escaparHTML(c.numero)}</td>
          <td>${escaparHTML(c.bairro)}</td>
          <td>${escaparHTML(c.cidade)}</td>
          <td>${escaparHTML(c.estado)}</td>
          <td class="text-truncate" style="max-width:150px" title="${escaparHTML(c.observacoes)}">${escaparHTML(c.observacoes)}</td>
          <td class="text-nowrap">${formatarData(c.dataCadastro)}</td>
          <td class="text-nowrap">${formatarData(c.dataAlteracao)}</td>
        </tr>`).join("");

      requestAnimationFrame(() => {
        tbody.innerHTML = htmlGerado;
      });
    }

    function carregarDadosPF() {
      const termo = (document.getElementById("inputCPF")?.value || "").toLowerCase().trim();
      let lista = getClientes();
      if (termo) {
        lista = lista.filter((c) => {
          const nomeCompletoVal = c.nomeCompleto || c.nome || "";
          const nomeMatch = nomeCompletoVal.toLowerCase().includes(termo);
          const ruaMatch = c.rua && c.rua.toLowerCase().includes(termo);
          
          const termoLimpo = termo.replace(/\D/g, "");
          const cpfLimpo = c.cpf ? c.cpf.replace(/\D/g, "") : "";
          const cpfMatch = termoLimpo && cpfLimpo === termoLimpo;
          
          const dataFormatada = c.dataNascimento ? formatarData(c.dataNascimento) : "";
          const dataMatch = dataFormatada && (dataFormatada === termo || c.dataNascimento === termo);
          
          return nomeMatch || ruaMatch || cpfMatch || dataMatch;
        });
      }
      renderizarTabela(lista);
    }

    function editarCliente(id) {
      const lista = getClientes();
      const cliente = lista.find((c) => Number(c.id) === Number(id));
      if (!cliente) { alert("Cliente não encontrado."); return; }
      
      localStorage.setItem(EDIT_KEY, JSON.stringify(cliente));
      
      setTimeout(() => {
        window.location.href = "cadclientesPF.html";
      }, 20);
    }

    function excluirCliente(id) {
      const lista = getClientes();
      const cliente = lista.find((c) => Number(c.id) === Number(id));
      const nome = cliente ? (cliente.nomeCompleto || cliente.nome) : id;
      if (!confirm(`Excluir o cliente "${nome}"?\nEsta ação não pode ser desfeita.`)) return;
      saveClientes(lista.filter((c) => Number(c.id) !== Number(id)));
      carregarDadosPF();
    }

    function novoClientePF() {
      localStorage.removeItem(EDIT_KEY);
      window.location.href = "cadclientesPF.html";
    }
    function exportarCSVPF() {
      const lista = getClientes();
      if (lista.length === 0) { alert("Nenhum cliente para exportar."); return; }
      const cab = ["ID","Nome","CPF","Data Nasc.","RG","Sexo","Telefone","Celular","Email","CEP","Rua","Número","Bairro","Cidade","Estado","Observações","Cadastro","Alteração"];
      const rows = lista.map((c) => [c.id, c.nomeCompleto || c.nome, c.cpf, c.dataNascimento, c.rg, c.sexo, c.telefone, c.celular, c.email, c.cep, c.rua, c.numero, c.bairro, c.cidade, c.estado, c.observacoes, c.dataCadastro, c.dataAlteracao]
        .map((v) => `"${String(v??'').replace(/"/g,'""')}"`).join(";")
      );
      const csv = [cab.map(h=>`"${h}"`).join(";"), ...rows].join("\r\n");
      const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8;"});
      const url = URL.createObjectURL(blob);
      const a = Object.assign(document.createElement("a"), {href:url, download:`clientesPF_${new Date().toISOString().slice(0,10)}.csv`});
      a.click();
      URL.revokeObjectURL(url);
    }

    function baixarJSONPF() {
      const lista = getClientes();
      if (lista.length === 0) { alert("Nenhum cliente para baixar."); return; }
      const blob = new Blob([JSON.stringify(lista,null,2)], {type:"application/json"});
      const url = URL.createObjectURL(blob);
      const a = Object.assign(document.createElement("a"), {href:url, download:`clientesPF_${new Date().toISOString().slice(0,10)}.json`});
      a.click();
      URL.revokeObjectURL(url);
    }

    function importarJSONPF(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const dados = JSON.parse(e.target.result);
          if (!Array.isArray(dados)) throw new Error("O JSON não é uma lista válida de clientes.");
          const existentes = getClientes();
          let maiorId = existentes.reduce((max, c) => Math.max(max, Number(c.id) || 0), 0);
          const idsMap = new Map(existentes.map((c, idx) => [Number(c.id), idx]));
          let add = 0, upd = 0;
          dados.forEach(novo => {
            const clienteNormalizado = {
              id: novo.id ? Number(novo.id) : null,
              nomeCompleto: novo.nomeCompleto || novo.nome || "",
              cpf: novo.cpf || "",
              dataNascimento: novo.dataNascimento || novo.dataNasc || "",
              rg: novo.rg || "",
              sexo: novo.sexo || "",
              telefone: novo.telefone || "",
              celular: novo.celular || "",
              email: novo.email || "",
              cep: novo.cep || "",
              rua: novo.rua || novo.endereco || "",
              numero: novo.numero || "",
              bairro: novo.bairro || "",
              cidade: novo.cidade || "",
              estado: novo.estado || "",
              observacoes: novo.observacoes || novo.obs || "",
              dataCadastro: novo.dataCadastro || new Date().toISOString(),
              dataAlteracao: novo.dataAlteracao || new Date().toISOString()
            };
            if (!clienteNormalizado.id) {
              maiorId++;
              clienteNormalizado.id = maiorId;
            }
            if (idsMap.has(clienteNormalizado.id)) {
              const idx = idsMap.get(clienteNormalizado.id);
              existentes[idx] = { ...existentes[idx], ...clienteNormalizado };
              upd++;
            } else {
              existentes.push(clienteNormalizado);
              idsMap.set(clienteNormalizado.id, existentes.length - 1);
              add++;
            }
          });
          saveClientes(existentes);
          carregarDadosPF();
          alert(`Importação concluída!\n\n✅ Adicionados: ${add}\n🔄 Atualizados: ${upd}`);
        } catch(err) {
          alert("Erro ao importar JSON:\n" + err.message);
        } finally {
          event.target.value = "";
        }
      };
      reader.readAsText(file, "UTF-8");
    }

    function pesquisarClientes(event) {
      if (event) event.preventDefault();
      carregarDadosPF();
    }

    ////////////////////////////////////////////////////////////////
    // INICIALIZAÇÃO DE EVENTOS DE ENTRADA (Debounce passivo anti-lag)
    ////////////////////////////////////////////////////////////////
    document.addEventListener("DOMContentLoaded", () => {
      // O evento de 'btnSair' foi removido porque agora é gerenciado pelo autenticacao.js de forma global

      if (localStorage.getItem("PDV_HABILITADO") !== "1") {
        alert("Acesso negado! Por favor, realize o login.");
        window.location.href = "index.html";
        return;
      }

      carregarDadosPF();

      // Debounce passivo: Aguarda o usuário parar de digitar por 150ms antes de re-renderizar a tabela
      let timeoutBusca = null;
      document.getElementById("inputCPF")?.addEventListener("input", () => {
          clearTimeout(timeoutBusca);
          timeoutBusca = setTimeout(() => {
              carregarDadosPF();
          }, 150);
      });
    });
  </script>

  <!-- Modal resultado Pesquisa Avançada -->

    <div class="modal-dialog modal-lg modal-dialog-centered">

        </div>
        <div class="modal-body" id="modalCPFNavBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
        </div>
      </div>
    </div>
  </div>
