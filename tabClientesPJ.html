                    if (sheet.href && sheet.href.indexOf("bootstrap.min.css") !== -1) {
                        if (sheet.cssRules && sheet.cssRules.length > 0) {
                            cssCarregado = true;
                            break;
                        }
                    }
                } catch (e) {
                    // Captura restrições de segurança de CORS se houverem
                }
            }

            if (!cssCarregado) {
                alert('bootstrap.min.css local não carregou. Usando CDN como reserva.');
                console.warn('bootstrap.min.css local não carregou. Usando CDN como reserva.');
                
                let cdn = document.createElement("link");
                cdn.rel = "stylesheet";
                cdn.href = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css";

                document.head.appendChild(cdn);

  <script>
    (() => {
      const getStoredTheme = () => localStorage.getItem('theme');
      const setStoredTheme = (tema) => localStorage.setItem('theme', tema);
      const getSystemTheme = () => window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      const resolveTheme = (tema) => tema === 'auto' ? getSystemTheme() : tema;
      const aplicarTema = (tema) => {
        document.documentElement.setAttribute('data-bs-theme', resolveTheme(tema));
      };
      const atualizarUI = (tema) => {
        const botaoPrincipal = document.getElementById('bd-theme');
        const itemAtivo = document.querySelector(`[data-bs-theme-value="${tema}"]`);
        if (!botaoPrincipal || !itemAtivo) return;
        document.querySelectorAll('[data-bs-theme-value]').forEach(el => {
          el.classList.remove('active');
          el.setAttribute('aria-pressed', 'false');
          el.querySelector('.bi.ms-auto')?.classList.add('d-none');
        });
        itemAtivo.classList.add('active');
        itemAtivo.setAttribute('aria-pressed', 'true');
        itemAtivo.querySelector('.bi.ms-auto')?.classList.remove('d-none');
        const hrefIcone = itemAtivo.querySelector('svg use')?.getAttribute('href');
        const iconePrincipal = botaoPrincipal.querySelector('.theme-icon-active use');
        if (hrefIcone && iconePrincipal) iconePrincipal.setAttribute('href', hrefIcone);
        botaoPrincipal.setAttribute('aria-label', `Toggle theme (${tema})`);
      };
      document.addEventListener('DOMContentLoaded', () => {
        const temaAtual = getStoredTheme() || 'auto';
        aplicarTema(temaAtual);
        atualizarUI(temaAtual);
        document.querySelectorAll('[data-bs-theme-value]').forEach(botao => {
          botao.addEventListener('click', () => {
            const tema = botao.getAttribute('data-bs-theme-value');
            setStoredTheme(tema);
            aplicarTema(tema);
            atualizarUI(tema);
          });
        });
      });
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        if ((getStoredTheme() || 'auto') === 'auto') aplicarTema('auto');
      });
    })();
  </script>

  <script>
    const STORAGE_KEY = "PDV_CLIENTES_PJ";
    const EDIT_KEY = "CLIENTE_PJ_EDITAR";

    console.log("[tabCliente] chave:", STORAGE_KEY);
    console.log("[tabCliente] raw :", localStorage.getItem(STORAGE_KEY));

    function getClientes() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; }
    }

    function saveClientes(lista) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(lista));
    }

    function formatarData(iso) {
      if (!iso) return "—";
      const d = new Date(iso.includes("T") ? iso : iso + "T00:00:00");
      if (isNaN(d)) return iso;
      return d.toLocaleDateString("pt-BR");
    }

    function escaparHTML(str) {
      if (str == null) return "";
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function renderizarTabela(lista) {
      const tbody = document.getElementById("tbodyClientes");
      const totalEl = document.getElementById("totalRegistros");
      totalEl.textContent = lista.length;
      if (lista.length === 0) {
        tbody.innerHTML = `<tr><td colspan="19" class="text-center text-muted py-4">Nenhum cliente cadastrado. <a href="cadclientesPJ.html" class="ms-2">Cadastrar agora →</a></td></tr>`;
        return;
      }
      tbody.innerHTML = lista.map((c) => `
        <tr>
          <td>${escaparHTML(c.id)}</td>
          <td class="text-nowrap">
            <button class="btn btn-sm btn-success py-0 px-1 me-1" title="Editar" onclick="editarCliente(${Number(c.id)})">✏️ Editar</button>
            <button class="btn btn-sm btn-danger py-0 px-1 me-1" title="Excluir" onclick="excluirCliente(${Number(c.id)})">🗑️ Deletar</button>
          </td>
          <td style="min-width:250px">${escaparHTML(c.razaoSocial)}</td>
          <td style="min-width:180px">${escaparHTML(c.cnpj)}</td>
          <td>${escaparHTML(c.nomeFantasia)}</td>
          <td>${escaparHTML(c.ie)}</td>
          <td>${escaparHTML(c.nomeResponsavel)}</td>
          <td style="min-width:120px">${escaparHTML(c.telefone)}</td>
          <td style="min-width:140px">${escaparHTML(c.celular)}</td>
          <td>${escaparHTML(c.email)}</td>
          <td style="min-width:110px">${escaparHTML(c.cep)}</td>
          <td style="min-width:200px">${escaparHTML(c.rua)}</td>
          <td>${escaparHTML(c.numero)}</td>
          <td>${escaparHTML(c.bairro)}</td>
          <td>${escaparHTML(c.cidade)}</td>
          <td>${escaparHTML(c.estado)}</td>
          <td class="text-truncate" style="max-width:150px" title="${escaparHTML(c.observacoes)}">${escaparHTML(c.observacoes)}</td>
          <td class="text-nowrap">${formatarData(c.dataCadastro)}</td>
          <td class="text-nowrap">${formatarData(c.dataAlteracao)}</td>
        </tr>`).join("");
    }
  function carregarDadosPJ() {
    const termo = (document.getElementById("inputCNPJ")?.value || "").toLowerCase().trim();
    let lista = getClientes();
    if (termo) {
      lista = lista.filter((c) => {
        // Texto livre (Conceito SQL LIKE)
        const razaoMatch = c.razaoSocial && c.razaoSocial.toLowerCase().includes(termo);
        const fantasiaMatch = c.nomeFantasia && c.nomeFantasia.toLowerCase().includes(termo);
        const ruaMatch = c.rua && c.rua.toLowerCase().includes(termo);
        const emailMatch = c.email && c.email.toLowerCase().includes(termo);
        
        // Chaves Numéricas (Identidade Exata)
        const termoLimpo = termo.replace(/\D/g, "");
        const cnpjLimpo = c.cnpj ? c.cnpj.replace(/\D/g, "") : "";
        const cnpjMatch = termoLimpo && cnpjLimpo === termoLimpo;
        
        const dataFormatada = c.dataAbertura ? formatarData(c.dataAbertura) : "";
        const dataMatch = dataFormatada && (dataFormatada === termo || c.dataAbertura === termo);
        
        return razaoMatch || fantasiaMatch || ruaMatch || emailMatch || cnpjMatch || dataMatch;
      });
    }
    renderizarTabela(lista);
  }

  function editarCliente(id) {
    const lista = getClientes();
    const cliente = lista.find((c) => Number(c.id) === Number(id));
    if (!cliente) {
      alert("Cliente não encontrado.");
      return;
    }
    localStorage.setItem(EDIT_KEY, JSON.stringify(cliente));
    window.location.href = "cadclientesPJ.html";
  }

  function excluirCliente(id) {
    const lista = getClientes();
    const cliente = lista.find((c) => Number(c.id) === Number(id));
    const razao = cliente?.razaoSocial || "—";
    const cnpj = cliente?.cnpj || "—";
    if (!confirm(`Excluir o cliente?\n\nRazão Social: ${razao}\nCNPJ: ${cnpj}\n\nEsta ação não pode ser desfeita.`)) return;
    saveClientes(lista.filter((c) => Number(c.id) !== Number(id)));
    carregarDadosPJ();
  }

  function novoClientePJ() {
    localStorage.removeItem(EDIT_KEY);
    window.location.href = "cadclientesPJ.html";
  }

  function exportarCSVPJ() {
    const lista = getClientes();
    if (lista.length === 0) {
      alert("Nenhum cliente para exportar.");
      return;
    }
    const cab = ["ID","Razão Social","CNPJ","Data Abertura","IE","Nome Responsável","Telefone","Celular","Email","CEP","Rua","Número","Bairro","Cidade","Estado","Observações","Cadastro","Alteração"];
    const rows = lista.map((c) => [c.id, c.razaoSocial, c.cnpj, c.dataAbertura, c.ie, c.nomeResponsavel, c.telefone, c.celular, c.email, c.cep, c.rua, c.numero, c.bairro, c.cidade, c.estado, c.observacoes, c.dataCadastro, c.dataAlteracao]
      .map((v) => `"${String(v??'').replace(/"/g,'""')}"`)
      .join(";")
    );
    const csv = [cab.map(h=>`"${h}"`).join(";"), ...rows].join("\r\n");
    const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8;"});
    const url = URL.createObjectURL(blob);
    const a = Object.assign(document.createElement("a"), {href:url, download:`clientesPJ_${new Date().toISOString().slice(0,10)}.csv`});
    a.click();
    URL.revokeObjectURL(url);
  }

  function baixarJSONPJ() {
    const lista = getClientes();
    if (lista.length === 0) {
      alert("Nenhum cliente para baixar.");
      return;
    }
    const blob = new Blob([JSON.stringify(lista,null,2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = Object.assign(document.createElement("a"), {href:url, download:`clientesPJ_${new Date().toISOString().slice(0,10)}.json` });
    a.click();
    URL.revokeObjectURL(url);
  }

  function importarJSONPJ(event) {
    const file = event.target.files;
    if (!file || file.length === 0) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const dados = JSON.parse(e.target.result);
        if (!Array.isArray(dados)) throw new Error("O JSON não é uma lista de clientes.");
        const existentes = getClientes();
        let maiorId = existentes.reduce((max, c) => Math.max(max, Number(c.id) || 0), 0);
        const idsMap = new Map(existentes.map((c, idx) => [Number(c.id), idx]));
        let add = 0, upd = 0;
        dados.forEach(novo => {
          const clienteNormalizado = {
            id: novo.id ? Number(novo.id) : null,
            razaoSocial: novo.razaoSocial || novo.razao || novo.nomeCompleto || novo.nome || "",
            cnpj: novo.cnpj || "",
            nomeFantasia: novo.nomeFantasia || novo.fantasia || "",
            ie: novo.ie || novo.inscricaoEstadual || "",
            nomeResponsavel: novo.nomeResponsavel || novo.responsavel || "",
            cargo: novo.cargo || "",
            porte: novo.porte || "",
            regimeTributario: novo.regimeTributario || "",
            telefone: novo.telefone || "",
            celular: novo.celular || "",
            email: novo.email || "",
            cep: novo.cep || "",
            rua: novo.rua || novo.endereco || "",
            numero: novo.numero || "",
            bairro: novo.bairro || "",
            cidade: novo.cidade || "",
            estado: novo.estado || "",
            observacoes: novo.observacoes || novo.obs || "",
            dataAbertura: novo.dataAbertura || "",
            dataCadastro: novo.dataCadastro || new Date().toISOString(),
            dataAlteracao: novo.dataAlteracao || new Date().toISOString()
          };
          if (!clienteNormalizado.id) {
            maiorId++;
            clienteNormalizado.id = maiorId;
          }
          if (idsMap.has(clienteNormalizado.id)) {
            const idx = idsMap.get(clienteNormalizado.id);
            existentes[idx] = { ...existentes[idx], ...clienteNormalizado };
            upd++;
          } else {
            existentes.push(clienteNormalizado);
            idsMap.set(clienteNormalizado.id, existentes.length - 1);
            add++;
          }
        });
        saveClientes(existentes);
        carregarDadosPJ();
        alert(`Importação concluída!\n\n✅ Adicionados: ${add}\n🔄 Atualizados: ${upd}`);
      } catch(err) {
        alert("Erro ao importar JSON:\n" + err.message);
      } finally {
        event.target.value = "";
      }
    };
    reader.readAsText(file[0], "UTF-8");
  }

    function pesquisarCNPJNav(event) {
      if (event) event.preventDefault();
      carregarDadosPJ();
    }

    document.addEventListener("DOMContentLoaded", () => {
      if (localStorage.getItem("PDV_HABILITADO") !== "1") {
        alert("Acesso negado! Por favor, realize o login.");
        window.location.href = "index.html";
        return;
      }

      carregarDadosPJ();
      document.getElementById("inputCNPJ")?.addEventListener("input", carregarDadosPJ);
    });

    window.addEventListener("pageshow", (event) => {
      if (event.persisted) {
        carregarDadosPJ();
      }
    });
  </script>
