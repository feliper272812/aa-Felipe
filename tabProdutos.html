    <script>
        document.addEventListener("DOMContentLoaded", function () {
            let cssCarregado = false;
            for (let i = 0; i < document.styleSheets.length; i++) {
                try {
                    let sheet = document.styleSheets[i];
                    if (sheet.href && sheet.href.indexOf("bootstrap.min.css") !== -1) {
                        if (sheet.cssRules && sheet.cssRules.length > 0) {
                            cssCarregado = true;
                            break;
                        }
                    }
                } catch (e) {
                    // Captura restrições de segurança de CORS se houverem
                }
            }

            if (!cssCarregado) {
                alert('bootstrap.min.css local não carregou. Usando CDN como reserva.');
                console.warn('bootstrap.min.css local não carregou. Usando CDN como reserva.');
                
                let cdn = document.createElement("link");
                cdn.rel = "stylesheet";
                cdn.href = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css";
                cdn.integrity = "sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH";
                cdn.crossOrigin = "anonymous";
                document.head.appendChild(cdn);
            }
        });
    </script>

<body class="d-flex flex-column h-100 autenticacao-pendente">

  <header>

  <main class="container-fluid px-2">
    <div class="table-container w-100">
      <div id="barraTituloProdutos">
        <h3 class="bg-success text-white p-2 text-center" style="border-radius: 8px 8px 0 0;">Produtos</h3>
      </div>
      
      <!-- Barra de Ferramentas de Ações (Produtos) -->
      <div class="sticky-top bg-body pt-2 pb-2 mb-3 border-bottom">
        <div class="d-flex flex-wrap align-items-center gap-1">
          <button class="btn btn-sm btn-primary text-light" onclick="novoProduto()">🆕 Novo</button>
          <button class="btn btn-sm btn-warning" onclick="baixarJSONProdutos()">⬇ JSON</button>
          
          <!-- Label vinculado ao novo input do tipo arquivo oculto -->
          <label for="arquivoJSON" class="btn btn-sm btn-info mb-0 text-dark" style="cursor:pointer;">📂 Importar</label>
          <input type="file" id="arquivoJSON" accept=".json" style="display: none;" onchange="importarJSONProdutos(event)">
          
          <button class="btn btn-sm btn-success" onclick="exportarCSVProdutos()">📊 CSV</button>
          <button class="btn btn-sm btn-outline-success" onclick="window.location.href='cadProdutos.html'">📋 Cadastro</button>
          <div class="vr mx-2"></div>
          <span class="badge text-bg-secondary">Total: <strong id="totalRegistros">0</strong></span>

          <div class="input-group input-group-sm ms-auto" style="max-width:300px">
            <input id="inputCodigoNav" class="form-control" placeholder="Pesq. por CódBar, Nome ou Estoque">
            <button class="btn btn-outline-success" onclick="pesquisarCodigo(event)">🔍</button>
          </div>
        </div>
      </div>

      <div class="tabela-scroll">
        <table id="tabelaProdutos" class="table table-striped table-hover table-sm">
          <thead>
            <tr>
              <th>ID</th>
              <th>Ações</th>
              <th>Status</th>
              <th style="min-width:220px">Nome do Produto</th>
              <th style="min-width:90px">Código</th>
              <th style="min-width:140px">Cód. Barras</th>
              <th style="min-width:100px">SKU</th>
              <th style="min-width:120px">Marca</th>
              <th style="min-width:120px">Categoria</th>
              <th>Unidade</th>
              <th style="min-width:100px">NCM</th>
              <th style="min-width:100px">CEST</th>
              <th style="min-width:110px">Preço Custo</th>
              <th style="min-width:110px">Preço Venda</th>
              <th>Estoque</th>

              <th class="text-truncate" style="max-width:180px">Descrição</th>

  <script>
    const STORAGE_KEY = 'PDV_PRODUTOS';
    const EDIT_KEY = 'PRODUTO_EDITAR';
    const SESSION_KEY = 'PDV_HABILITADO';

    function getProdutos() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; }
    }

    function saveProdutos(lista) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(lista));
    }

    function formatarData(iso) {
      if (!iso) return "—";
      const d = new Date(iso.includes("T") ? iso : iso + "T00:00:00");
      return isNaN(d) ? iso : d.toLocaleDateString("pt-BR");
    }

    function formatarMoeda(valor) {
      if (valor == null || valor === "") return "—";
      return Number(valor).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
    }

    function escaparHTML(str) {
      if (str == null) return "";
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function renderizarTabela(lista) {
      const tbody = document.getElementById("tbodyProdutos");
      document.getElementById("totalRegistros").textContent = lista.length;
      if (lista.length === 0) {
        tbody.innerHTML = `<tr><td colspan="19" class="text-center text-muted py-4">Nenhum produto cadastrado. <a href="cadProdutos.html" class="ms-2">Cadastrar agora →</a></td></tr>`;
        return;
      }
      tbody.innerHTML = lista.map((p) => `
        <tr>
          <td>${escaparHTML(p.id)}</td>
          <td class="text-nowrap">
            <button class="btn btn-sm btn-success py-0 px-1" onclick="editarProduto('${escaparHTML(p.id)}')">✏️ Editar</button>
            <button class="btn btn-sm btn-danger py-0 px-1" onclick="excluirProduto('${escaparHTML(p.id)}')">🗑️ Deletar</button>
          </td>
          <td><span class="badge ${p.status === 'Ativo' || !p.status ? 'bg-primary' : 'bg-warning text-dark'}">${escaparHTML(p.status || 'Ativo')}</span></td>
          <td>${escaparHTML(p.nome || p.nomeProduto)}</td>
          <td>${escaparHTML(p.codigo)}</td>
          <td>${escaparHTML(p.codigoBarras)}</td>
          <td>${escaparHTML(p.sku)}</td>
          <td>${escaparHTML(p.marca)}</td>
          <td>${escaparHTML(p.categoria)}</td>
          <td>${escaparHTML(p.unidade)}</td>
          <td>${escaparHTML(p.ncm)}</td>
          <td>${escaparHTML(p.cest)}</td>
          <td>${formatarMoeda(p.precoCusto)}</td>
          <td>${formatarMoeda(p.precoVenda)}</td>
          <td>${escaparHTML(p.estoque)}</td>
          <td>${escaparHTML(p.estoqueMinimo)}</td>
          <td class="text-truncate" style="max-width:180px" title="${escaparHTML(p.descricao)}">${escaparHTML(p.descricao)}</td>
          <td>${formatarData(p.dataCadastro)}</td>
          <td>${formatarData(p.dataAlteracao)}</td>
        </tr>`).join("");
    }
    function carregarDadosProdutos() {
      const termo = (document.getElementById("inputCodigoNav")?.value || "").trim();
      let lista = getProdutos();
      
      if (termo) {
        // FUNÇÃO DE SANITIZAÇÃO INTERNA ESTILO SQL LIKE (REMOVE ACENTOS E DEIXA MINÚSCULO)
        const normalizarParaLike = (str) => 
          (str ?? '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

        const termoLike = normalizarParaLike(termo);

        lista = lista.filter((p) => {
          const nomeMatch = normalizarParaLike(p.nome || p.nomeProduto).includes(termoLike);
          const eanMatch  = normalizarParaLike(p.codigoBarras || p.codBarras).includes(termoLike);
          const codMatch  = normalizarParaLike(p.codigo).includes(termoLike);
          const skuMatch  = normalizarParaLike(p.sku).includes(termoLike);
          const marcaMatch = normalizarParaLike(p.marca).includes(termoLike);
          const catMatch  = normalizarParaLike(p.categoria).includes(termoLike);
          
          // COMPARAÇÃO DE ESTOQUE (PERMITE BUSCAR POR NÚMERO EXATO OU PARCIAL EM TEXTO)
          const estoqueMatch = normalizarParaLike(p.estoque).includes(termoLike);

          // RETORNA VERDADEIRO SE ENCONTRAR EM QUALQUER UM DOS CAMPOS SOLICITADOS
          return nomeMatch || eanMatch || estoqueMatch || codMatch || skuMatch || marcaMatch || catMatch;
        });
      }
      renderizarTabela(lista);
    }

    function editarProduto(id) {
      const lista = getProdutos();
      const produto = lista.find((p) => String(p.id) === String(id));
      if (!produto) {
        alert("Produto não encontrado.");
        return;
      }
      try {
        localStorage.setItem(EDIT_KEY, JSON.stringify(produto));
        window.location.href = "cadProdutos.html";
      } catch (err) {
        alert("Erro ao preparar edição. O armazenamento pode estar cheio.");
      }
    }

    function excluirProduto(id) {
      const lista = getProdutos();
      const produto = lista.find((p) => String(p.id) === String(id));
      if (!produto || !confirm(`Excluir o produto "${produto.nome || produto.nomeProduto}"?`)) return;
      saveProdutos(lista.filter((p) => String(p.id) !== String(id)));
      carregarDadosProdutos();
    }
    
    function novoProduto() {
      localStorage.removeItem(EDIT_KEY);
      window.location.href = "cadProdutos.html";
    }

    function exportarCSVProdutos() {
      const lista = getProdutos();
      if (lista.length === 0) {
        alert("Nenhum produto para exportar.");
        return;
      }
      const cab = ["ID","Nome","Código","Cód. Barras","SKU","Marca","Categoria","Unidade","NCM","CEST","Preço Custo","Preço Venda","Estoque","Estoque Mín.","Status","Descrição","Cadastro","Alteração"];
      const rows = lista.map((p) => [
        p.id, p.nome || p.nomeProduto, p.codigo, p.codigoBarras, p.sku, p.marca, p.categoria, p.unidade, p.ncm, p.cest, p.precoCusto, p.precoVenda, p.estoque, p.estoqueMinimo, p.status, p.descricao, p.dataCadastro, p.dataAlteracao
      ].map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(";"));
      const csv = [cab.map(h => `"${h}"`).join(";"), ...rows].join("\(\r\\)n");
      const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = Object.assign(document.createElement("a"), { href: url, download: `produtos_${new Date().toISOString().slice(0, 10)}.csv` });
      a.click();
      URL.revokeObjectURL(url);
    }

    function baixarJSONProdutos() {
      const lista = getProdutos();
      if (lista.length === 0) {
        alert("Nenhum produto para baixar.");
        return;
      }
      const blob = new Blob([JSON.stringify(lista, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = Object.assign(document.createElement("a"), { href: url, download: `produtos_${new Date().toISOString().slice(0, 10)}.json` });
      a.click();
      URL.revokeObjectURL(url);
    }

    function importarJSONProdutos(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          const dados = JSON.parse(e.target.result);
          if (!Array.isArray(dados)) throw new Error("JSON inválido.");
          const existentes = getProdutos();
          const ids = new Set(existentes.map(p => String(p.id)));
          let add = 0, upd = 0;
          dados.forEach(novo => {
            if (!novo.id) return;
            if (ids.has(String(novo.id))) {
              const idx = existentes.findIndex(p => String(p.id) === String(novo.id));
              existentes[idx] = { ...existentes[idx], ...novo };
              upd++;
            } else {
              existentes.push(novo);
              add++;
            }
          });
          saveProdutos(existentes);
          carregarDadosProdutos();
          alert(`Sucesso!\n✅ Adicionados: ${add}\n🔄 Atualizados: ${upd}`);
        } catch (err) {
          alert("Erro ao importar: " + err.message);
        } finally {
          event.target.value = "";
        }
      };
      reader.readAsText(file, "UTF-8");
    }
    function pesquisarCodigo(event) {
      if(event) event.preventDefault();
      const termo = (document.getElementById("inputCodigoNav").value || "").trim();
      if (!termo) {
        alert("Digite um termo para pesquisar.");
        return;
      }
      
      const lista = getProdutos();
      
      // Sanitização idêntica para manter o mesmo comportamento LIKE SQL no modal
      const normalizarParaLike = (str) => 
        (str ?? '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      const termoLike = normalizarParaLike(termo);

      const resultado = lista.filter(p => 
        normalizarParaLike(p.nome || p.nomeProduto).includes(termoLike) ||
        normalizarParaLike(p.codigo).includes(termoLike) || 
        normalizarParaLike(p.codigoBarras || p.codBarras).includes(termoLike) || 
        normalizarParaLike(p.sku).includes(termoLike) ||
        normalizarParaLike(p.estoque).includes(termoLike)
      );

      const body = document.getElementById("modalCodigoNavBody");
      if (resultado.length === 0) {
        body.innerHTML = `<p class="text-center text-muted py-3">Nenhum produto encontrado.</p>`;
      } else {
        body.innerHTML = resultado.map(p => `
          <div class="card mb-3 border-success">
            <div class="card-header bg-success text-white fw-bold">#${escaparHTML(p.id)} — ${escaparHTML(p.nome || p.nomeProduto)}</div>
            <div class="card-body">
              ${p.imagemBase64 ? `<img src="\${p.imagemBase64}" style="max-width:120px; max-height:120px;" class="mb-3 d-block border rounded p-1">` : ''}
              <div class="row g-2 small">
                <div class="col-sm-6"><strong>Código:</strong> ${escaparHTML(p.codigo)}</div>
                <div class="col-sm-6"><strong>Cód. Barras:</strong> ${escaparHTML(p.codigoBarras || p.codBarras || '—')}</div>
                <div class="col-sm-6"><strong>Preço Venda:</strong> ${formatarMoeda(p.precoVenda)}</div>
                <div class="col-sm-6"><strong>Estoque:</strong> ${escaparHTML(p.estoque)}</div>
                <div class="col-sm-6"><strong>Marca:</strong> ${escaparHTML(p.marca)}</div>
                <div class="col-sm-6"><strong>Categoria:</strong> ${escaparHTML(p.categoria)}</div>
              </div>
              <div class="mt-3">
                <button class="btn btn-sm btn-success" onclick="editarProduto('${escaparHTML(p.id)}')">✏️ Editar</button>
              </div>
            </div>
          </div> `).join("");
      }
      new bootstrap.Modal(document.getElementById("modalCodigoNav")).show();
    }

    document.addEventListener("DOMContentLoaded", () => {
      if (localStorage.getItem("PDV_HABILITADO") !== "1") {
        alert("Acesso negado! Por favor, realize o login.");
        window.location.href = "index.html";
        return;
      }
      carregarDadosProdutos();
      document.getElementById("inputCodigoNav")?.addEventListener("input", carregarDadosProdutos);
    });
  </script>

  <!-- AJUSTE DA ALTURA DO CONTAINER DA TABELA: vai até 1px acima do footer -->
  <script>
    (function () {
      // Descobre onde começa o footer (topo, em px, relativo à janela)
      function obterTopoFooter(box) {
        // 1) Elementos visíveis do footer (tag <footer> ou qualquer coisa dentro do placeholder)
        const candidatos = Array.from(
          document.querySelectorAll('footer, #footer-placeholder, #footer-placeholder *')
        ).filter(function (el) {
          const r = el.getBoundingClientRect();
          return el.offsetHeight > 0 && r.width > 0 && !box.contains(el) && !el.contains(box);
        });
        if (candidatos.length) {
          return Math.min.apply(null, candidatos.map(function (el) {
            return el.getBoundingClientRect().top;
          }));
        }

        // 2) Plano B: pergunta ao navegador o que está desenhado rente à borda inferior da janela
        const main = document.querySelector('main');
        if (main) main.style.pointerEvents = 'none';
        let el = document.elementFromPoint(window.innerWidth / 2, window.innerHeight - 2);
        if (main) main.style.pointerEvents = '';
        if (!el || el === document.body || el === document.documentElement) return null;
        while (el.parentElement && el.parentElement !== document.body &&
               el.parentElement.getBoundingClientRect().bottom >= window.innerHeight - 2 &&
               el.parentElement.offsetHeight < window.innerHeight / 2) {
          el = el.parentElement;
        }
        return el.getBoundingClientRect().top;
      }

      function ajustarAlturaTabela() {
        const box = document.querySelector('.tabela-scroll');
        if (!box) return;

        const topoFooter = obterTopoFooter(box);
        if (topoFooter == null) {
          console.warn('[tabProdutos] footer não encontrado para ajustar a altura da tabela.');
          return;
        }

        const altura = Math.floor(topoFooter - 1 - box.getBoundingClientRect().top);
        if (altura > 100) box.style.height = altura + 'px';
      }

      let agendado = false;
      function agendar() {
        if (agendado) return;
        agendado = true;
        requestAnimationFrame(function () { agendado = false; ajustarAlturaTabela(); });
      }

      window.addEventListener('load', agendar);
      window.addEventListener('resize', agendar);
      document.addEventListener('DOMContentLoaded', agendar);

      // navbar e footer são injetados pelo include.js (assíncrono): reajusta quando a página mudar
      new MutationObserver(agendar).observe(document.body, { childList: true, subtree: true });
      if (window.ResizeObserver) new ResizeObserver(agendar).observe(document.body);

      // garantia extra para carregamentos lentos (fontes, imagens do navbar etc.)
      setTimeout(agendar, 300);
      setTimeout(agendar, 1000);
    })();
  </script>
