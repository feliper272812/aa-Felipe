<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Definir Temas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{transition:background .3s,color .3s;}
    .hero{padding:80px 0;}
    .theme-card{cursor:pointer;transition:transform .2s;}
    .theme-card:hover{transform:translateY(-4px);}
  </style>
</head>
<body data-bs-theme="light">
<nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">Temas UI</a>
  </div>
</nav>
<section class="hero text-center container">
  <h1 class="display-5 fw-bold">Escolha um tema</h1>
  <p class="lead">Página em HTML5 + CSS3 + Bootstrap 5.3 para alternar estilos.</p>
</section>
<div class="container pb-5">
  <div class="row g-4">
    <div class="col-md-4">
      <div class="card theme-card h-100" onclick="setTheme('light')">
        <div class="card-body text-center">
          <h3>Claro</h3>
          <p>Visual limpo e iluminado.</p>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card theme-card h-100" onclick="setTheme('dark')">
        <div class="card-body text-center">
          <h3>Escuro</h3>
          <p>Ideal para ambientes com pouca luz.</p>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card theme-card h-100" onclick="setCustom()">
        <div class="card-body text-center">
          <h3>Personalizado</h3>
          <p>Tons modernos em azul.</p>
        </div>
      </div>
